name: Preview Database Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-db-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  test-preview-db:
    name: Run tests against configured isolated preview database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PREVIEW_DB_URL: ${{ secrets.PREVIEW_DB_URL }}
      PREVIEW_DB_ANON_KEY: ${{ secrets.PREVIEW_DB_ANON_KEY }}
      PREVIEW_DB_SERVICE_ROLE_KEY: ${{ secrets.PREVIEW_DB_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Detect isolated preview database
        id: config
        shell: bash
        run: |
          if [[ -z "$PREVIEW_DB_URL" || -z "$PREVIEW_DB_ANON_KEY" || -z "$PREVIEW_DB_SERVICE_ROLE_KEY" ]]; then
            echo "run_tests=false" >> "$GITHUB_OUTPUT"
            echo "Preview database tests are skipped because no complete isolated preview database configuration is present."
            echo "Development and production databases will not be used as fallbacks."
            exit 0
          fi

          [[ "$PREVIEW_DB_URL" =~ ^https://[a-z0-9-]+\.supabase\.co/?$ ]] || {
            echo "Configured PREVIEW_DB_URL is invalid."
            exit 1
          }

          echo "run_tests=true" >> "$GITHUB_OUTPUT"

      - name: Verify preview database is reachable
        if: steps.config.outputs.run_tests == 'true'
        shell: bash
        run: |
          STATUS=$(curl --silent --show-error --output /tmp/preview-db-health.json \
            --write-out "%{http_code}" --max-time 20 \
            -H "apikey: $PREVIEW_DB_ANON_KEY" \
            -H "Authorization: Bearer $PREVIEW_DB_ANON_KEY" \
            "${PREVIEW_DB_URL%/}/rest/v1/")
          test "$STATUS" = "200" || {
            echo "Preview database health check failed with HTTP $STATUS."
            exit 1
          }

      - name: Install dependencies
        if: steps.config.outputs.run_tests == 'true'
        run: npm ci --ignore-scripts

      - name: Run integration tests against preview database
        if: steps.config.outputs.run_tests == 'true'
        env:
          SUPABASE_URL: ${{ env.PREVIEW_DB_URL }}
          SUPABASE_ANON_KEY: ${{ env.PREVIEW_DB_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.PREVIEW_DB_SERVICE_ROLE_KEY }}
          RUN_PREVIEW_DB_TESTS: 'true'
        run: |
          npm run test:integration -- tests/integration/api/ --reporter=verbose 2>&1 | tee test-results.log

      - name: Run deterministic gate tests
        if: steps.config.outputs.run_tests == 'true'
        env:
          SUPABASE_URL: ${{ env.PREVIEW_DB_URL }}
          SUPABASE_ANON_KEY: ${{ env.PREVIEW_DB_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.PREVIEW_DB_SERVICE_ROLE_KEY }}
          RUN_PREVIEW_DB_TESTS: 'true'
        run: |
          npm run test -- tests/proofs/ --reporter=verbose 2>&1 | tee -a test-results.log

      - name: Record skipped result
        if: steps.config.outputs.run_tests != 'true'
        run: |
          cat > test-results.log <<'EOF'
          SKIPPED: No explicitly configured isolated preview database.
          No development or production database was used as a fallback.
          EOF

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-db-test-results-${{ github.event.pull_request.number }}
          path: test-results.log
          retention-days: 30
          if-no-files-found: error

      - name: Comment test results on PR
        if: always()
        uses: actions/github-script@v7
        env:
          RUN_TESTS: ${{ steps.config.outputs.run_tests }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const ran = process.env.RUN_TESTS === 'true';
            const testResults = fs.existsSync('test-results.log')
              ? fs.readFileSync('test-results.log', 'utf8')
              : 'Test results unavailable';

            const body = ran
              ? `## Preview Database Tests\n\nStatus: **EXECUTED**\n\n<details><summary>Test output</summary>\n\n\`\`\`\n${testResults.substring(0, 3000)}\n\`\`\`\n</details>`
              : `## Preview Database Tests\n\nStatus: **SKIPPED — NOT CONFIGURED**\n\nNo isolated preview database was configured. The workflow did not fall back to development or production data.`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
