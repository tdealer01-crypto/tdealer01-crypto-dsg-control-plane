name: Preview Database Tests

on:
  pull_request:
    types: [opened, synchronize]
  workflow_run:
    workflows: ["Preview Database Create"]
    types: [completed]

concurrency:
  group: preview-db-tests-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  test-preview-db:
    name: Run tests against preview database
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate preview database credentials
        id: preview_db
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          PROJECT_ID="preview-pr-${PR_NUM}"
          echo "project_id=${PROJECT_ID}" >> $GITHUB_OUTPUT
          echo "url=https://${PROJECT_ID}.supabase.co" >> $GITHUB_OUTPUT

      - name: Wait for preview database to be ready
        timeout-minutes: 10
        run: |
          # Wait for preview database project to be created and ready
          # This polls the Supabase API to check project status

          RETRIES=0
          MAX_RETRIES=60
          INTERVAL=10

          PROJECT_NAME="preview-pr-${{ github.event.pull_request.number }}"

          while [[ $RETRIES -lt $MAX_RETRIES ]]; do
            RESPONSE=$(curl -s -w "\n%{http_code}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
              "https://api.supabase.com/v1/projects")

            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | sed '$d')

            if [[ "$HTTP_CODE" == "200" ]]; then
              STATUS=$(echo "$BODY" | jq -r ".[] | select(.name == \"${PROJECT_NAME}\") | .status" 2>/dev/null)

              if [[ "$STATUS" == "ACTIVE" ]]; then
                echo "✅ Preview database is ready"
                exit 0
              elif [[ -n "$STATUS" ]]; then
                echo "Database status: $STATUS (waiting...)"
              fi
            fi

            RETRIES=$((RETRIES + 1))
            if [[ $RETRIES -lt $MAX_RETRIES ]]; then
              echo "Waiting for preview database... ($RETRIES/$MAX_RETRIES)"
              sleep $INTERVAL
            fi
          done

          echo "⚠️ Preview database not ready after 10 minutes"
          echo "Tests will proceed with caution or be skipped"

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests against preview database
        env:
          SUPABASE_URL: ${{ steps.preview_db.outputs.url }}
          SUPABASE_ANON_KEY: ${{ secrets.PREVIEW_DB_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PREVIEW_DB_SERVICE_ROLE_KEY }}
          RUN_PREVIEW_DB_TESTS: 'true'
        run: |
          echo "Running integration tests against preview database..."
          npm run test:integration -- tests/integration/api/ --reporter=verbose 2>&1 | tee test-results.log || true

      - name: Run deterministic gate tests
        env:
          SUPABASE_URL: ${{ steps.preview_db.outputs.url }}
          SUPABASE_ANON_KEY: ${{ secrets.PREVIEW_DB_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PREVIEW_DB_SERVICE_ROLE_KEY }}
          RUN_PREVIEW_DB_TESTS: 'true'
        run: |
          echo "Running deterministic gate tests against preview database..."
          npm run test -- tests/proofs/ --reporter=verbose 2>&1 | tee -a test-results.log || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-db-test-results-${{ github.event.pull_request.number }}
          path: test-results.log
          retention-days: 30

      - name: Comment test results on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const prNumber = context.issue.number;

            let testResults = '⚠️ Test results unavailable';
            try {
              testResults = fs.readFileSync('test-results.log', 'utf8');
            } catch (e) {
              console.log('Could not read test results');
            }

            // Extract summary from results
            const passed = (testResults.match(/✓/g) || []).length;
            const failed = (testResults.match(/✗/g) || []).length;

            let comment = `## 🧪 Preview Database Tests\n\n`;
            comment += `**Passed:** ${passed}\n`;
            comment += `**Failed:** ${failed}\n`;

            if (failed === 0) {
              comment += `**Status:** ✅ All tests passed\n`;
            } else {
              comment += `**Status:** ❌ Some tests failed\n`;
            }

            comment += `\n<details>\n<summary>Test Output</summary>\n\n\`\`\`\n`;
            comment += testResults.substring(0, 3000); // Limit output length
            if (testResults.length > 3000) {
              comment += `\n... (truncated, see artifacts for full results)\n`;
            }
            comment += `\`\`\`\n</details>\n`;

            github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
