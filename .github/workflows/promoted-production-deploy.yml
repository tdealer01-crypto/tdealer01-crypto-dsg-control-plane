name: Promoted Production Deployment

on:
  workflow_call:
    inputs:
      operation:
        description: Protected production operation selected by the trusted caller
        required: true
        type: string
      commit_sha:
        description: Exact current main commit to verify and deploy
        required: true
        type: string
      migration_request_id:
        description: Audited Vercel account migration request ID
        required: false
        default: ''
        type: string
      destination_team_id:
        description: Verified destination Vercel team ID
        required: false
        default: ''
        type: string
      destination_project_id:
        description: Verified destination Vercel project ID
        required: false
        default: ''
        type: string
    outputs:
      bootstrap_url:
        description: Verified READY destination production bootstrap URL
        value: ${{ jobs.bootstrap_vercel_account.outputs.bootstrap_url }}
  workflow_dispatch:
    inputs:
      promotion_id:
        description: Pending agent workspace promotion UUID
        required: true
        type: string
      commit_sha:
        description: Exact current main commit to verify and deploy
        required: true
        type: string
      workspace_key:
        description: Agent workspace key
        required: true
        default: dsg-agent-dev
        type: string

concurrency:
  group: promoted-production-deployment
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_CLI_VERSION: 58.0.0
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  AGENT_WORKSPACE_SUPABASE_URL: ${{ secrets.AGENT_WORKSPACE_SUPABASE_URL }}
  AGENT_WORKSPACE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.AGENT_WORKSPACE_SUPABASE_SERVICE_ROLE_KEY }}
  AGENT_WORKSPACE_RELEASE_AGENT_ID: ${{ secrets.AGENT_WORKSPACE_RELEASE_AGENT_ID }}
  PROMOTION_ID: ${{ inputs.promotion_id }}
  COMMIT_SHA: ${{ inputs.commit_sha }}
  WORKSPACE_KEY: ${{ inputs.workspace_key }}
  GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  verify-approve-deploy:
    name: Verify Evidence, Approve Once, Deploy Exact Commit
    if: inputs.operation != 'vercel-account-bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: "Production – dsg-qubo-api"
    steps:
      - name: Validate dispatch inputs
        shell: bash
        run: |
          [[ "$COMMIT_SHA" =~ ^[0-9a-fA-F]{7,64}$ ]] || { echo "Invalid commit SHA"; exit 1; }
          [[ "$PROMOTION_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "Invalid promotion UUID"; exit 1; }
          [[ "$WORKSPACE_KEY" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{2,63}$ ]] || { echo "Invalid workspace key"; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Require exact current main commit
        shell: bash
        run: |
          git fetch origin main --depth=1
          CHECKED_OUT=$(git rev-parse HEAD)
          MAIN_HEAD=$(git rev-parse origin/main)
          test "${CHECKED_OUT,,}" = "${COMMIT_SHA,,}" || { echo "Checked-out commit mismatch"; exit 1; }
          test "$CHECKED_OUT" = "$MAIN_HEAD" || { echo "Commit is not current main head"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Resolve audited Vercel routing
        env:
          LEGACY_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEW_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_NEW || secrets.VERCEL_TOKEN }}
          NEW_VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID_NEW }}
          NEW_VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_NEW }}
        run: node scripts/resolve-vercel-routing.mjs

      - name: Verify required release configuration
        shell: bash
        run: |
          for name in \
            VERCEL_TOKEN \
            NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY \
            AGENT_WORKSPACE_SUPABASE_URL AGENT_WORKSPACE_SUPABASE_SERVICE_ROLE_KEY \
            AGENT_WORKSPACE_RELEASE_AGENT_ID; do
            test -n "${!name}" || { echo "Missing required configuration: $name"; exit 1; }
          done
          [[ "$VERCEL_ORG_ID" =~ ^[A-Za-z0-9_-]{3,128}$ ]] || { echo "Invalid Vercel account ID"; exit 1; }
          [[ "$VERCEL_PROJECT_ID" =~ ^prj_[A-Za-z0-9]+$ ]] || { echo "Invalid Vercel project ID"; exit 1; }
          if test "$VERCEL_USE_NEW_ACCOUNT" = "true"; then
            test "$VERCEL_ORG_ID" != "team_n189mlAdVHR6cGGiaAwsKzQ0" || { echo "New-account routing has the legacy account ID"; exit 1; }
            test "$VERCEL_PROJECT_ID" != "prj_k02PTNzCJRBN5CcRtg6hFdd0HjuW" || { echo "New-account routing has the legacy project ID"; exit 1; }
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check release scripts
        run: |
          node --check scripts/lib/agent-workspace-release.mjs
          node --check scripts/approve-agent-workspace-promotion.mjs
          node --check scripts/finalize-agent-workspace-promotion.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Migration tests
        run: npm run test:migrations

      - name: Dependency security gate
        run: npm audit --audit-level=high

      - name: Production build
        run: npm run build

      - name: Pull Vercel preview configuration
        run: npx --yes "vercel@$VERCEL_CLI_VERSION" pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Deploy exact commit to preview
        id: preview
        shell: bash
        run: |
          set -euo pipefail
          cp vercel.json "$RUNNER_TEMP/vercel.production.json"
          trap 'cp "$RUNNER_TEMP/vercel.production.json" vercel.json' EXIT
          cp vercel.preview.json vercel.json

          PREVIEW_URL=$(npx --yes "vercel@$VERCEL_CLI_VERSION" deploy --yes --token="$VERCEL_TOKEN" \
            --meta=promotion_id="$PROMOTION_ID" \
            --meta=commit="$COMMIT_SHA" \
            --meta=release_stage=promotion-preview)
          test -n "$PREVIEW_URL"
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Verify preview health behind Vercel Authentication
        run: bash scripts/verify-vercel-health.sh "${{ steps.preview.outputs.preview_url }}" /api/health

      - name: Locate current READY production rollback target
        id: rollback
        shell: bash
        run: |
          RESPONSE=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&target=production&state=READY&limit=20&teamId=$VERCEL_ORG_ID")
          ROLLBACK_HOST=$(echo "$RESPONSE" | jq -r '.deployments[] | select(.target == "production" and .state == "READY") | .url' | head -n 1)
          test -n "$ROLLBACK_HOST" && test "$ROLLBACK_HOST" != "null" || { echo "No READY production rollback target"; exit 1; }
          ROLLBACK_URL="https://$ROLLBACK_HOST"
          curl --fail --retry 5 --retry-delay 5 "$ROLLBACK_URL/api/health"
          echo "rollback_url=$ROLLBACK_URL" >> "$GITHUB_OUTPUT"

      - name: Approve exact deployment promotion from trusted CI evidence
        id: approve
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          ROLLBACK_URL: ${{ steps.rollback.outputs.rollback_url }}
        run: node scripts/approve-agent-workspace-promotion.mjs

      - name: Pull Vercel production configuration
        run: npx --yes "vercel@$VERCEL_CLI_VERSION" pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production artifact
        run: npx --yes "vercel@$VERCEL_CLI_VERSION" build --prod --token="$VERCEL_TOKEN"

      - name: Deploy approved exact commit to production
        id: production
        shell: bash
        run: |
          PRODUCTION_URL=$(npx --yes "vercel@$VERCEL_CLI_VERSION" deploy --prebuilt --prod --token="$VERCEL_TOKEN" \
            --meta=promotion_id="$PROMOTION_ID" \
            --meta=evidence_hash="${{ steps.approve.outputs.evidence_hash }}" \
            --meta=commit="$COMMIT_SHA")
          test -n "$PRODUCTION_URL"
          echo "production_url=$PRODUCTION_URL" >> "$GITHUB_OUTPUT"

      - name: Verify production health
        id: production_health
        continue-on-error: true
        run: curl --fail --retry 10 --retry-delay 6 "${{ steps.production.outputs.production_url }}/api/health"

      - name: Roll back unhealthy production deployment
        if: steps.production_health.outcome == 'failure'
        shell: bash
        run: |
          npx --yes "vercel@$VERCEL_CLI_VERSION" rollback "${{ steps.rollback.outputs.rollback_url }}" \
            --token="$VERCEL_TOKEN"
          npx --yes "vercel@$VERCEL_CLI_VERSION" rollback status \
            --token="$VERCEL_TOKEN" --timeout=120s
          curl --fail --retry 10 --retry-delay 6 "${{ steps.rollback.outputs.rollback_url }}/api/health"

      - name: Reject promotion after health-triggered rollback
        if: steps.production_health.outcome == 'failure'
        env:
          PROMOTION_OUTCOME: rejected
          FAILURE_REASON: Production health failed and traffic was rolled back to the verified previous deployment
        run: node scripts/finalize-agent-workspace-promotion.mjs

      - name: Fail workflow after rollback
        if: steps.production_health.outcome == 'failure'
        run: exit 1

      - name: Consume promotion after successful deployment
        if: steps.production_health.outcome == 'success'
        env:
          PROMOTION_OUTCOME: executed
          PRODUCTION_URL: ${{ steps.production.outputs.production_url }}
        run: node scripts/finalize-agent-workspace-promotion.mjs

      - name: Reject pending or approved promotion when workflow fails early
        if: failure()
        continue-on-error: true
        env:
          PROMOTION_OUTCOME: rejected
          FAILURE_REASON: Promoted production workflow failed before successful health verification
        run: node scripts/finalize-agent-workspace-promotion.mjs

  bootstrap_vercel_account:
    name: Verify and Create Destination Production Bootstrap
    if: inputs.operation == 'vercel-account-bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: "Production – dsg-qubo-api"
    outputs:
      bootstrap_url: ${{ steps.bootstrap.outputs.bootstrap_url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_NEW || secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ inputs.destination_team_id }}
      VERCEL_PROJECT_ID: ${{ inputs.destination_project_id }}
      MIGRATION_REQUEST_ID: ${{ inputs.migration_request_id }}
    steps:
      - name: Validate protected bootstrap inputs
        shell: bash
        run: |
          [[ "$COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "Invalid exact commit SHA"; exit 1; }
          [[ "$MIGRATION_REQUEST_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{2,127}$ ]] || { echo "Invalid migration request ID"; exit 1; }
          [[ "$VERCEL_ORG_ID" =~ ^[A-Za-z0-9_-]{3,128}$ ]] || { echo "Invalid destination Vercel team ID"; exit 1; }
          [[ "$VERCEL_PROJECT_ID" =~ ^prj_[A-Za-z0-9]+$ ]] || { echo "Invalid destination Vercel project ID"; exit 1; }
          test "$VERCEL_ORG_ID" != "team_n189mlAdVHR6cGGiaAwsKzQ0" || { echo "Destination is the legacy Vercel account"; exit 1; }
          test "$VERCEL_PROJECT_ID" != "prj_k02PTNzCJRBN5CcRtg6hFdd0HjuW" || { echo "Destination is the legacy Vercel project"; exit 1; }
          test -n "$VERCEL_TOKEN" || { echo "Missing VERCEL_TOKEN_NEW"; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Require exact current main commit for bootstrap
        shell: bash
        run: |
          git fetch origin main --depth=1
          CHECKED_OUT=$(git rev-parse HEAD)
          MAIN_HEAD=$(git rev-parse origin/main)
          test "${CHECKED_OUT,,}" = "${COMMIT_SHA,,}" || { echo "Checked-out commit mismatch"; exit 1; }
          test "$CHECKED_OUT" = "$MAIN_HEAD" || { echo "Commit is not current main head"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependencies
        run: npm ci --ignore-scripts

      - name: Re-run migration and release safety gates
        run: |
          node --check scripts/lib/vercel-env-sync.mjs
          node --check scripts/sync-vercel-envs.mjs
          node --check scripts/resolve-vercel-routing.mjs
          npx vitest run \
            tests/unit/scripts/vercel-destination-auth.test.ts \
            tests/unit/scripts/vercel-env-sync.test.ts \
            tests/unit/scripts/vercel-routing.test.ts \
            tests/unit/scripts/vercel-env-migration-request.test.ts
          npm audit --audit-level=high --omit=dev

      - name: Pull destination production configuration
        run: npx --yes "vercel@$VERCEL_CLI_VERSION" pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build exact destination production artifact
        run: npx --yes "vercel@$VERCEL_CLI_VERSION" build --prod --token="$VERCEL_TOKEN"

      - name: Create destination READY production rollback target
        id: bootstrap
        shell: bash
        run: |
          BOOTSTRAP_URL=$(npx --yes "vercel@$VERCEL_CLI_VERSION" deploy --prebuilt --prod --token="$VERCEL_TOKEN" \
            --meta=migration_request="$MIGRATION_REQUEST_ID" \
            --meta=migration_run="${{ github.run_id }}" \
            --meta=commit="$COMMIT_SHA" \
            --meta=release_stage=account-migration-bootstrap)
          test -n "$BOOTSTRAP_URL"
          echo "bootstrap_url=$BOOTSTRAP_URL" >> "$GITHUB_OUTPUT"

      - name: Verify destination production rollback target
        env:
          BOOTSTRAP_URL: ${{ steps.bootstrap.outputs.bootstrap_url }}
        shell: bash
        run: |
          curl --fail --retry 10 --retry-delay 6 "$BOOTSTRAP_URL/api/health"
          BOOTSTRAP_HOST=${BOOTSTRAP_URL#https://}
          RESPONSE=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&target=production&state=READY&limit=20&teamId=$VERCEL_ORG_ID")
          MATCH=$(echo "$RESPONSE" | jq -r --arg host "$BOOTSTRAP_HOST" \
            '.deployments[] | select(.target == "production" and .state == "READY" and .url == $host) | .url' | head -n 1)
          test "$MATCH" = "$BOOTSTRAP_HOST" || { echo "Bootstrap deployment is not a READY production rollback target"; exit 1; }

      - name: Record protected bootstrap evidence
        env:
          BOOTSTRAP_URL: ${{ steps.bootstrap.outputs.bootstrap_url }}
        run: |
          {
            echo "## Vercel destination production bootstrap"
            echo ""
            echo "- Migration request: $MIGRATION_REQUEST_ID"
            echo "- Exact main commit: $COMMIT_SHA"
            echo "- Destination team ID: $VERCEL_ORG_ID"
            echo "- Destination project ID: $VERCEL_PROJECT_ID"
            echo "- READY and healthy URL: $BOOTSTRAP_URL"
            echo "- Existing user traffic: **not switched**"
          } >> "$GITHUB_STEP_SUMMARY"
