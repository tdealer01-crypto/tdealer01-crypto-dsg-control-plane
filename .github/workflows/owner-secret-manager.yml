name: DSG Owner Secret Manager

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Secret Manager operation
        required: true
        type: choice
        options: [list, verify, sync]
        default: verify

# Preserve full workflow-token capability for the owner console as requested.
# Azure authorization is still enforced independently by OIDC + Key Vault RBAC.
permissions: write-all

concurrency:
  group: dsg-owner-secret-manager
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: rg-t.dealer01-0468
  AZURE_WEBAPP_NAME: dsg-control-plane
  AZURE_KEY_VAULT_NAME: dsg-shared-secrets

jobs:
  owner-secret-manager:
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Enforce repository owner
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = 'tdealer01-crypto' || {
            echo '::error::OWNER_ONLY_OPERATION'
            exit 1
          }

      - name: Validate canonical secret contract
        shell: bash
        run: |
          set -euo pipefail
          file='config/azure-ops-secrets.contract.json'
          test "$(jq -er '.provider' "$file")" = 'azure-key-vault'
          test "$(jq -er '.vaultName' "$file")" = "$AZURE_KEY_VAULT_NAME"
          test "$(jq -er '.resourceGroup' "$file")" = "$AZURE_RESOURCE_GROUP"
          test "$(jq -er '.ownerAccess.githubActor' "$file")" = 'tdealer01-crypto'
          test "$(jq -er '.ownerAccess.entrypoint' "$file")" = '.github/workflows/owner-secret-manager.yml'
          test "$(jq -er '.authority.workflowPermissionPolicy' "$file")" = 'preserve-existing-permissions'

      - name: Resolve governed Azure OIDC identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          file='config/azure-github-oidc-identity.json'
          client_id="$(jq -er '.clientId' "$file")"
          tenant_id="$(jq -er '.tenantId' "$file")"
          subscription_id="$(jq -er '.subscriptionId' "$file")"
          test "$(jq -er '.resourceGroup' "$file")" = "$AZURE_RESOURCE_GROUP"
          echo "::add-mask::$client_id"
          echo "::add-mask::$tenant_id"
          echo "::add-mask::$subscription_id"
          echo "client_id=$client_id" >> "$GITHUB_OUTPUT"
          echo "tenant_id=$tenant_id" >> "$GITHUB_OUTPUT"
          echo "subscription_id=$subscription_id" >> "$GITHUB_OUTPUT"

      - name: Login to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ steps.identity.outputs.client_id }}
          tenant-id: ${{ steps.identity.outputs.tenant_id }}
          subscription-id: ${{ steps.identity.outputs.subscription_id }}

      - name: Ensure owner console can manage Key Vault secrets
        shell: bash
        run: |
          set -euo pipefail
          vault_id="$(az keyvault show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_KEY_VAULT_NAME" \
            --query id -o tsv)"
          test -n "$vault_id"

          arm_token="$(az account get-access-token \
            --resource https://management.azure.com/ \
            --query accessToken -o tsv)"
          principal_id="$(TOKEN="$arm_token" python3 - <<'PY'
          import base64, json, os
          token = os.environ['TOKEN']
          part = token.split('.')[1]
          part += '=' * (-len(part) % 4)
          payload = json.loads(base64.urlsafe_b64decode(part.encode()))
          oid = payload.get('oid')
          if not oid:
              raise SystemExit('OID claim not found')
          print(oid)
          PY
          )"
          unset arm_token
          test -n "$principal_id"
          echo "::add-mask::$principal_id"

          existing_id="$(az role assignment list \
            --assignee-object-id "$principal_id" \
            --scope "$vault_id" \
            --role 'Key Vault Secrets Officer' \
            --query '[0].id' -o tsv)"
          if [[ -z "$existing_id" ]]; then
            az role assignment create \
              --assignee-object-id "$principal_id" \
              --assignee-principal-type ServicePrincipal \
              --role 'Key Vault Secrets Officer' \
              --scope "$vault_id" \
              --only-show-errors --output none
          fi
          echo 'Owner-triggered GitHub OIDC console has Key Vault Secrets Officer at vault scope.' >> "$GITHUB_STEP_SUMMARY"

      - name: Sync present GitHub credentials into canonical Key Vault
        if: inputs.operation == 'sync'
        shell: bash
        env:
          MONITORING_API_KEY: ${{ secrets.MONITORING_API_KEY }}
          MONITORING_ORG_ID: ${{ secrets.MONITORING_ORG_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          DSG_PROMOTION_EVALUATION_SECRET: ${{ secrets.DSG_PROMOTION_EVALUATION_SECRET }}
          DSG_POST_DEPLOY_FEEDBACK_SECRET: ${{ secrets.DSG_POST_DEPLOY_FEEDBACK_SECRET }}
          DSG_PRODUCTION_ROLLBACK_SECRET: ${{ secrets.DSG_PRODUCTION_ROLLBACK_SECRET }}
          DSG_GITHUB_AUTOMATION_TOKEN: ${{ secrets.DSG_GITHUB_AUTOMATION_TOKEN }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          umask 077
          seeded_file="$RUNNER_TEMP/dsg-owner-seeded-secret-names.txt"
          : > "$seeded_file"

          seed_if_present() {
            local env_name="$1" secret_name="$2" value="${!env_name:-}"
            if [[ -z "$value" ]]; then
              return 0
            fi
            local value_file
            value_file="$(mktemp "$RUNNER_TEMP/dsg-secret-XXXXXX")"
            printf '%s' "$value" > "$value_file"
            chmod 600 "$value_file"
            az keyvault secret set \
              --vault-name "$AZURE_KEY_VAULT_NAME" \
              --name "$secret_name" \
              --file "$value_file" \
              --encoding utf-8 \
              --only-show-errors --output none
            rm -f "$value_file"
            printf '%s\n' "$secret_name" >> "$seeded_file"
          }

          seed_if_present MONITORING_API_KEY monitoring-api-key
          seed_if_present MONITORING_ORG_ID monitoring-org-id
          seed_if_present SLACK_WEBHOOK_URL slack-webhook-url
          seed_if_present SUPABASE_SERVICE_ROLE_KEY supabase-service-role-key
          seed_if_present NEXTAUTH_SECRET nextauth-secret
          seed_if_present UPSTASH_REDIS_REST_TOKEN upstash-redis-rest-token
          seed_if_present DSG_PROMOTION_EVALUATION_SECRET dsg-promotion-evaluation-secret
          seed_if_present DSG_POST_DEPLOY_FEEDBACK_SECRET dsg-post-deploy-feedback-secret
          seed_if_present DSG_PRODUCTION_ROLLBACK_SECRET dsg-production-rollback-secret
          seed_if_present DSG_GITHUB_AUTOMATION_TOKEN dsg-github-automation-token
          seed_if_present AZURE_CLIENT_SECRET azure-client-secret

          seeded_count="$(wc -l < "$seeded_file" | tr -d ' ')"
          echo "Seeded/rotated $seeded_count present GitHub credential(s); values were never printed." >> "$GITHUB_STEP_SUMMARY"
          if [[ "$seeded_count" -gt 0 ]]; then
            echo 'Names:' >> "$GITHUB_STEP_SUMMARY"
            sed 's/^/- /' "$seeded_file" >> "$GITHUB_STEP_SUMMARY"
          fi
          rm -f "$seeded_file"

      - name: List secret names only
        if: inputs.operation == 'list'
        shell: bash
        run: |
          set -euo pipefail
          echo '## dsg-shared-secrets inventory' >> "$GITHUB_STEP_SUMMARY"
          az keyvault secret list \
            --vault-name "$AZURE_KEY_VAULT_NAME" \
            --query '[].name' \
            --only-show-errors \
            --output tsv \
            | sort \
            | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"

      - name: Verify canonical secret inventory
        if: inputs.operation == 'verify' || inputs.operation == 'sync'
        shell: bash
        run: |
          set -euo pipefail
          contract='config/azure-ops-secrets.contract.json'
          missing_required=0
          present=0
          optional_missing=0
          report="$RUNNER_TEMP/dsg-secret-inventory-report.txt"
          : > "$report"

          while IFS=$'\t' read -r env_name secret_name required; do
            if actual="$(az keyvault secret show \
              --vault-name "$AZURE_KEY_VAULT_NAME" \
              --name "$secret_name" \
              --query name -o tsv 2>/dev/null)" && [[ "$actual" == "$secret_name" ]]; then
              present=$((present + 1))
              printf 'PRESENT\t%s\t%s\n' "$env_name" "$secret_name" >> "$report"
            elif [[ "$required" == 'true' ]]; then
              missing_required=$((missing_required + 1))
              printf 'MISSING_REQUIRED\t%s\t%s\n' "$env_name" "$secret_name" >> "$report"
            else
              optional_missing=$((optional_missing + 1))
              printf 'MISSING_OPTIONAL\t%s\t%s\n' "$env_name" "$secret_name" >> "$report"
            fi
          done < <(jq -r '.secrets[] | [.environmentName,.keyVaultName,(.required|tostring)] | @tsv' "$contract")

          {
            echo '## Canonical Secret Manager verification'
            echo "- vault: $AZURE_KEY_VAULT_NAME"
            echo "- present: $present"
            echo "- missing required: $missing_required"
            echo "- missing optional: $optional_missing"
            echo '- values read/printed: no'
            echo ''
            echo '```text'
            cat "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$report"

          [[ "$missing_required" -eq 0 ]] || {
            echo "::error::SECRET_MANAGER_REQUIRED_ENTRIES_MISSING=$missing_required"
            exit 1
          }

      - name: Verify production App Service Key Vault references
        if: inputs.operation == 'verify' || inputs.operation == 'sync'
        shell: bash
        env:
          AZURE_SLOT: production
        run: bash scripts/secrets-manager.sh validate
