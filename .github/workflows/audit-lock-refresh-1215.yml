name: audit-lock-refresh-1215

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  refresh-lock:
    if: github.event.pull_request.number == 1215 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Refresh production dependency lock
        run: npm audit fix --package-lock-only --omit=dev

      - name: Verify production dependency audit
        run: npm audit --audit-level=high --omit=dev

      - name: Commit refreshed lock if changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: refresh production dependency lock"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
