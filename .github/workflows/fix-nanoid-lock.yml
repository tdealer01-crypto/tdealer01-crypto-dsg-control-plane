name: Fix nanoid lockfile

on:
  push:
    branches:
      - codex/automatic-revenue-compliance-gate-20260806
    paths:
      - package.json
      - .github/workflows/fix-nanoid-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    if: ${{ !contains(github.event.head_commit.message, '[lockbot]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/automatic-revenue-compliance-gate-20260806
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Resolve lockfile from npm registry
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify clean install
        run: npm ci --ignore-scripts

      - name: Verify production dependency audit
        run: npm audit --audit-level=high --omit=dev

      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Expected package-lock.json to change, but npm produced no diff."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(deps): refresh nanoid lockfile [lockbot]"
          git push origin HEAD:codex/automatic-revenue-compliance-gate-20260806
