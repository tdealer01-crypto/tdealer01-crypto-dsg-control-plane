name: No Production Mocks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-no-production-mocks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify product runtime has no forbidden synthetic paths
        run: node scripts/verify-no-production-mocks.mjs
