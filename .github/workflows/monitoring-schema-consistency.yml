name: Schema Consistency Check

on:
  schedule:
    - cron: '0 */6 * * *' # Every 6 hours
  workflow_dispatch:
  pull_request:
    paths:
      - 'supabase/migrations/**'

jobs:
  verify-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run schema consistency check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "Verifying schema consistency across all repositories..."

      - name: Check migration versions
        run: |
          echo "Checking migration versions..."
          ls -la supabase/migrations/ | tail -5

      - name: Verify unified monitoring endpoints
        env:
          MONITORING_URL: ${{ secrets.PRODUCTION_URL }}
          X_ORG_ID: ${{ secrets.MONITORING_ORG_ID }}
          MONITORING_API_KEY: ${{ secrets.MONITORING_API_KEY }}
        run: |
          if [ -z "$MONITORING_URL" ] || [ -z "$MONITORING_API_KEY" ] || [ -z "$X_ORG_ID" ]; then
            echo "## Monitoring endpoint verification"
            echo "Status: SKIPPED — NOT CONFIGURED"
            echo ""
            echo "PRODUCTION_URL, MONITORING_API_KEY, and MONITORING_ORG_ID must all be"
            echo "set for this check to run. No endpoint was contacted, so this run is"
            echo "not evidence that monitoring endpoints are healthy."
            exit 0
          fi

          echo "Verifying monitoring endpoints..."
          curl -fsS -X GET \
            -H "Authorization: Bearer $MONITORING_API_KEY" \
            -H "x-org-id: $X_ORG_ID" \
            "$MONITORING_URL/api/dsg/v1/monitoring/data-sync?check=metrics" \
            -o schema-check.json

          jq .data.metrics schema-check.json | head -20

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-check-results
          path: schema-check.json
          if-no-files-found: ignore
