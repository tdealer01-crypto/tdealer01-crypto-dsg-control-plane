name: Retired Vercel Environment Migration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Explain retired provider path
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const target = JSON.parse(await readFile('config/production-deployment-target.json', 'utf8'));
          console.log(JSON.stringify(target, null, 2));
          console.error('BLOCK: Vercel environment migration is retired because Vercel is not an active DSG production target.');
          process.exit(1);
          NODE
