name: Trinity Revenue System Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - development

jobs:
  deploy-trinity-api:
    name: Deploy Trinity API Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Trinity API to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          TRINITY_API_URL: ${{ secrets.TRINITY_API_URL }}
          TRINITY_JWT_TOKEN: ${{ secrets.TRINITY_JWT_TOKEN }}
        run: |
          echo "🚀 Deploying Trinity API Service"
          echo "Trinity API URL: $TRINITY_API_URL"
          echo "JWT Token configured: $([ -n '$TRINITY_JWT_TOKEN' ] && echo 'yes' || echo 'no')"

          # Deploy to Render (example - adjust for your deployment platform)
          # curl -X POST https://api.render.com/deploy \
          #   -H "Authorization: Bearer $RENDER_API_KEY"

  apply-supabase-migration:
    name: Apply Supabase Migration
    runs-on: ubuntu-latest
    needs: deploy-trinity-api
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Apply Trinity Revenue Tables Migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          echo "📊 Applying Supabase migration"

          # Set Supabase project
          supabase projects list --access-token $SUPABASE_ACCESS_TOKEN

          # Apply migration via SQL
          supabase db execute --project-id $SUPABASE_PROJECT_ID \
            --file supabase/migrations/20260817_trinity_revenue_tables.sql \
            --access-token $SUPABASE_ACCESS_TOKEN || echo "Migration may already be applied"

  configure-secrets:
    name: Configure GitHub Secrets
    runs-on: ubuntu-latest
    needs: deploy-trinity-api
    steps:
      - uses: actions/checkout@v4

      - name: Verify Secrets Configured
        env:
          TRINITY_API_URL: ${{ secrets.TRINITY_API_URL }}
          TRINITY_JWT_TOKEN: ${{ secrets.TRINITY_JWT_TOKEN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "🔐 Checking required secrets"

          MISSING=0

          [ -z "$TRINITY_API_URL" ] && echo "❌ TRINITY_API_URL missing" && MISSING=1 || echo "✅ TRINITY_API_URL configured"
          [ -z "$TRINITY_JWT_TOKEN" ] && echo "❌ TRINITY_JWT_TOKEN missing" && MISSING=1 || echo "✅ TRINITY_JWT_TOKEN configured"
          [ -z "$CRON_SECRET" ] && echo "❌ CRON_SECRET missing" && MISSING=1 || echo "✅ CRON_SECRET configured"
          [ -z "$SUPABASE_URL" ] && echo "❌ SUPABASE_URL missing" && MISSING=1 || echo "✅ SUPABASE_URL configured"
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && echo "❌ SUPABASE_SERVICE_ROLE_KEY missing" && MISSING=1 || echo "✅ SUPABASE_SERVICE_ROLE_KEY configured"

          if [ $MISSING -eq 1 ]; then
            echo ""
            echo "⚠️ Some secrets are missing. Configure them in:"
            echo "  Settings → Secrets and variables → Actions"
            exit 1
          fi

  test-revenue-sync:
    name: Test Trinity Revenue Sync
    runs-on: ubuntu-latest
    needs: [apply-supabase-migration, configure-secrets]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Test cron endpoint (dry-run)
        env:
          TRINITY_API_URL: ${{ secrets.TRINITY_API_URL }}
          TRINITY_JWT_TOKEN: ${{ secrets.TRINITY_JWT_TOKEN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "🧪 Testing Trinity revenue sync"

          # Run typecheck
          npm run typecheck

          # Run build
          npm run build

          echo "✅ Build succeeded - revenue sync ready for deployment"

  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-trinity-api, apply-supabase-migration, configure-secrets, test-revenue-sync]
    if: always()
    steps:
      - name: Deployment Report
        run: |
          echo "## Trinity Automatic Revenue System Deployment"
          echo ""
          echo "### Status"
          echo "- Trinity API Service: ${{ needs.deploy-trinity-api.result }}"
          echo "- Supabase Migration: ${{ needs.apply-supabase-migration.result }}"
          echo "- Secrets Configuration: ${{ needs.configure-secrets.result }}"
          echo "- Revenue Sync Test: ${{ needs.test-revenue-sync.result }}"
          echo ""
          echo "### Next Steps"
          echo "1. Monitor `/api/cron/trinity-revenue-sync` endpoint"
          echo "2. Check revenue records in Supabase dashboard"
          echo "3. Configure Stripe metering (optional)"
          echo ""
          echo "### Monitoring"
          echo "- Query: SELECT * FROM trinity_revenue_records ORDER BY created_at DESC LIMIT 10;"
          echo "- Health: GET /api/cron/trinity-revenue-sync?period=1h"
