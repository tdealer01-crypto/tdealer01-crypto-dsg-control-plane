name: WebdriverIO Security Fix

on:
  pull_request:
    paths:
      - '.github/workflows/webdriverio-security-fix.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

jobs:
  regenerate-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Override vulnerable Puppeteer browser extractor and regenerate lockfile
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs')
          const path = 'package.json'
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'))
          pkg.overrides = { ...(pkg.overrides || {}), '@puppeteer/browsers': '3.0.6' }
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n')
          NODE
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
      - name: Verify exact production dependency security gate
        run: npm audit --audit-level=high
      - name: Verify overridden dependency tree
        run: npm ls webdriverio @wdio/config @wdio/utils @puppeteer/browsers extract-zip modern-tar
      - name: Verify WebDriverIO runtime module compatibility
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const wdioUtils = await import('@wdio/utils/node')
          if (!wdioUtils || typeof wdioUtils !== 'object') throw new Error('@wdio/utils/node failed to load')
          const wdio = await import('webdriverio')
          if (typeof wdio.remote !== 'function') throw new Error('webdriverio.remote is unavailable')
          console.log('WebDriverIO runtime module compatibility: PASS')
          NODE
      - name: Commit generated dependency files if changed
        shell: bash
        run: |
          set -euo pipefail
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'Dependency files already match audited remediation.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(deps): override vulnerable puppeteer browser extractor'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
