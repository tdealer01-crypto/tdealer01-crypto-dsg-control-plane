name: Legacy dependency remediation candidate (non-force)
on:
  pull_request:
    paths:
      - '.github/workflows/legacy-audit-remediation-candidate.yml'
      - 'package.json'
      - 'package-lock.json'
concurrency:
  group: legacy-audit-remediation-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  audit-fix-candidate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/legacy-dependency-audit-nonbreaking-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated audit branch
        uses: actions/checkout@v4
        with:
          ref: fix/legacy-dependency-audit-nonbreaking-20261030
          persist-credentials: true
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Generate non-force lockfile remediation candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-candidate-evidence
          npm pkg set overrides.zod=4.6.7
          npm install --package-lock-only --ignore-scripts --no-fund
          # SECURITY CANDIDATE ONLY: test the latest published OpenAI SDK 7.x,
          # do not use npm audit fix --force; commit only after full checks.
          npm install openai@7 --package-lock-only --ignore-scripts --no-fund
          npm ci --ignore-scripts
          set +e
          npm audit fix --package-lock-only --ignore-scripts --no-fund > audit-candidate-evidence/audit-fix.log 2>&1
          code=$?
          set -e
          echo "npm_audit_fix_exit=$code" > audit-candidate-evidence/result.txt
          echo 'force_used=false' >> audit-candidate-evidence/result.txt
          echo 'production_deploy=false' >> audit-candidate-evidence/result.txt
          echo "commit_before=$(git rev-parse HEAD)" >> audit-candidate-evidence/result.txt
          git diff --stat -- package.json package-lock.json | tee audit-candidate-evidence/changed-packages.txt
      - name: Verify regenerated lockfile and application compatibility
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run typecheck
          npm run test:integration
          npm run test:unit
      - name: Retain actual production audit verdict
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npm audit --audit-level=high --omit=dev --json > audit-candidate-evidence/audit-after.json
          code=$?
          set -e
          echo "production_audit_exit=$code" >> audit-candidate-evidence/result.txt
          node -e "let x=require('./audit-candidate-evidence/audit-after.json'); console.log('Vulnerability counts:',JSON.stringify(x.metadata?.vulnerabilities??{}))"
          if [ "$code" -ne 0 ]; then
            echo 'BLOCKED: production npm audit not clean; candidate must not be committed' >> audit-candidate-evidence/result.txt
            exit 1
          fi
          echo 'production_audit=PASS' >> audit-candidate-evidence/result.txt
      - name: Commit safe candidate to this PR branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_HEAD_REF" = 'fix/legacy-dependency-audit-nonbreaking-20261030'
          test "$GITHUB_REPOSITORY" = 'tdealer01-crypto/tdealer01-crypto-dsg-control-plane'
          git add -- package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'No lockfile candidate changes to commit.' >> audit-candidate-evidence/result.txt
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(deps): apply npm audit non-force compatible lockfile updates'
            git push origin HEAD:refs/heads/fix/legacy-dependency-audit-nonbreaking-20261030
            echo "candidate_commit=$(git rev-parse HEAD)" >> audit-candidate-evidence/result.txt
          fi
      - name: Upload evidence (not production release proof)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-audit-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: audit-candidate-evidence/
          if-no-files-found: warn
