name: Pause Vercel Cost Lock

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pause-vercel-cost-lock.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pause-vercel-project:
    name: Pause Vercel project
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_NEW || secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_6pEhvA6GmVXYajBuJ2PUPFcs
      VERCEL_PROJECT_ID: prj_EsrB0dLrqbDKPDTMiKFGadZMny5M
    steps:
      - name: Require Vercel credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo "Missing VERCEL_TOKEN_NEW / VERCEL_TOKEN"; exit 1; }

      - name: Pause project through official Vercel API
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl --silent --show-error \
            --output "$RUNNER_TEMP/vercel-pause-response.txt" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v1/projects/$VERCEL_PROJECT_ID/pause?teamId=$VERCEL_TEAM_ID")
          cat "$RUNNER_TEMP/vercel-pause-response.txt"
          echo "pause_http_status=$HTTP_CODE"
          test "$HTTP_CODE" = "200"

      - name: Verify project API remains reachable for management
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl --silent --show-error \
            --output "$RUNNER_TEMP/vercel-project-response.json" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_TEAM_ID")
          echo "project_http_status=$HTTP_CODE"
          test "$HTTP_CODE" = "200"
          node -e "const p=require(process.env.RUNNER_TEMP + '/vercel-project-response.json'); console.log(JSON.stringify({id:p.id,name:p.name,paused:p.paused,pausedAt:p.pausedAt,updatedAt:p.updatedAt},null,2))"
