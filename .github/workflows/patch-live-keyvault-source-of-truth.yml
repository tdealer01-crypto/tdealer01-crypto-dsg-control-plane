name: Patch verified live Key Vault source of truth

on:
  push:
    branches:
      - fix/live-keyvault-source-of-truth
    paths:
      - '.github/workflows/patch-live-keyvault-source-of-truth.yml'

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Replace only the verified stale Key Vault binding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          old = 'dsg-kv-tdealer01-0468'
          new = 'dsg-shared-secrets'
          expected = {
              Path('docs/ops/azure-runtime-env-sync.md'): 2,
              Path('.github/workflows/sync-azure-app-settings.yml'): 1,
              Path('.github/workflows/inspect-azure-resource-topology.yml'): 1,
              Path('.github/workflows/inspect-control-plane-identity-access.yml'): 2,
              Path('.github/workflows/inspect-control-plane-runtime-access-v2.yml'): 1,
              Path('.github/workflows/inspect-control-plane-deployer-authority.yml'): 1,
          }

          total = 0
          for path, count in expected.items():
              text = path.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} stale references, found {actual}')
              path.write_text(text.replace(old, new), encoding='utf-8')
              total += actual

          if total != 8:
              raise SystemExit(f'expected 8 total replacements, got {total}')

          remaining = []
          for path in expected:
              if old in path.read_text(encoding='utf-8'):
                  remaining.append(str(path))
          if remaining:
              raise SystemExit(f'stale Key Vault binding remains: {remaining}')
          PY

          git diff --check
          grep -Fq 'AZURE_KEY_VAULT_NAME: dsg-shared-secrets' .github/workflows/inspect-control-plane-runtime-access-v2.yml
          grep -Fq 'AZURE_KEY_VAULT_NAME: dsg-shared-secrets' .github/workflows/inspect-control-plane-deployer-authority.yml

      - name: Commit verified source correction and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-live-keyvault-source-of-truth.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/ops/azure-runtime-env-sync.md \
            .github/workflows/sync-azure-app-settings.yml \
            .github/workflows/inspect-azure-resource-topology.yml \
            .github/workflows/inspect-control-plane-identity-access.yml \
            .github/workflows/inspect-control-plane-runtime-access-v2.yml \
            .github/workflows/inspect-control-plane-deployer-authority.yml \
            .github/workflows/patch-live-keyvault-source-of-truth.yml
          git diff --cached --check
          git commit -m 'fix(ops): align Key Vault source with live App Service references'
          git push origin HEAD:${GITHUB_REF_NAME}
