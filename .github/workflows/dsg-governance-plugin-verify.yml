name: DSG governance plugin validation
on:
  pull_request:
    paths:
      - '.claude-plugin/plugin.json'
      - '.claude-plugin/marketplace.json'
      - '.claude-plugin/README.md'
      - 'plugins/**'
      - 'skills/dsg-action-layer-ged/SKILL.md'
      - 'scripts/verify-dsg-governance-plugin.mjs'
      - 'scripts/verify-claude-marketplace.mjs'
      - '.github/workflows/dsg-governance-plugin-verify.yml'
  push:
    branches:
      - main
    paths:
      - '.claude-plugin/plugin.json'
      - '.claude-plugin/marketplace.json'
      - '.claude-plugin/README.md'
      - 'plugins/**'
      - 'skills/dsg-action-layer-ged/SKILL.md'
      - 'scripts/verify-dsg-governance-plugin.mjs'
      - 'scripts/verify-claude-marketplace.mjs'
      - '.github/workflows/dsg-governance-plugin-verify.yml'
permissions:
  contents: read
jobs:
  validate-governance-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Verify all Claude marketplace source paths and identities
        run: node scripts/verify-claude-marketplace.mjs
      - name: Check offline manifest and scoped server contract
        run: node scripts/verify-dsg-governance-plugin.mjs
      - name: Probe existing AWS MCP authentication boundary (read-only, no credentials)
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --max-time 15 \
            -H 'Accept: application/json, text/event-stream' \
            -o /dev/null -w '%{http_code}' 'https://aws.dsg.pics/mcp')"
          printf 'Unauthenticated AWS MCP HTTP status: %s\n' "$code"
          if [ "$code" != '401' ]; then
            echo 'BLOCKED: expected OAuth authorization boundary (HTTP 401); no execution attempted' >&2
            exit 1
          fi
      - name: Install pinned Claude Code validator
        run: npm install -g @anthropic-ai/claude-code@2.1.300
      - name: Confirm CLI version
        run: claude --version
      - name: Validate scoped DSG Governance plugin
        run: claude plugin validate ./plugins/dsg-governance --strict
      - name: Validate marketplace packaging with Claude CLI
        run: claude plugin validate .
      - name: Add local checkout marketplace
        run: claude plugin marketplace add ./
      - name: Install scoped DSG Governance plugin
        run: claude plugin install dsg-governance@dsg-plugins
      - name: Inspect and assert exact installed component inventory
        run: |
          set -euo pipefail
          claude plugin list
          details="$(claude plugin details dsg-governance)"
          printf '%s\n' "$details"
          printf '%s\n' "$details" | grep -Eq 'Skills \(3\)'
          printf '%s\n' "$details" | grep -Eq 'MCP servers \(1\)[[:space:]]+dsg-spacetime'
          if printf '%s\n' "$details" | grep -Eq 'Skills \(25\)|MCP servers \(10\)'; then
            echo 'FAIL: installed package accidentally includes legacy monorepo components' >&2
            exit 1
          fi
      - name: Install remaining Claude marketplace plugins in isolated runner
        run: |
          set -euo pipefail
          for plugin in proofgate-review dsg-verify evidence-guard pr-body-helper compliance-ising-z3; do
            claude plugin install "${plugin}@dsg-plugins"
            claude plugin details "$plugin"
          done

      - name: Record installation E2E evidence and SHA-256 checksums
        run: |
          set -euo pipefail
          mkdir -p marketplace-ci-evidence
          {
            echo 'scope=Claude Code marketplace local install only; NO production execution'
            echo "commit=$(git rev-parse HEAD)"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "claude_cli_version=$(claude --version)"
            echo 'status=PASS (preceding packaging validation/install steps exited successfully)'
            echo 'aws_mcp_anonymous_probe=HTTP_401'
            echo 'user_oauth=NOT_TESTED'
            echo 'governed_execute=NOT_TESTED'
            echo 'production_evidence=NOT_TESTED'
          } > marketplace-ci-evidence/result.txt
          claude plugin list > marketplace-ci-evidence/plugin-list.txt
          claude plugin details dsg-governance > marketplace-ci-evidence/dsg-governance-details.txt
          sha256sum .claude-plugin/marketplace.json \
            plugins/{proofgate-review,dsg-verify,evidence-guard,pr-body-helper,dsg-governance,compliance-ising-z3}/.claude-plugin/plugin.json \
            plugins/dsg-governance/.mcp.json \
            plugins/dsg-governance/skills/*/SKILL.md > marketplace-ci-evidence/SHA256SUMS
          sha256sum -c marketplace-ci-evidence/SHA256SUMS

      - name: Upload package installation evidence (not production proof)
        uses: actions/upload-artifact@v4
        with:
          name: claude-marketplace-install-${{ github.run_id }}-${{ github.run_attempt }}
          path: marketplace-ci-evidence/
          if-no-files-found: error
