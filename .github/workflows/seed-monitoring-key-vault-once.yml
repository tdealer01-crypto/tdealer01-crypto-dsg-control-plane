name: Seed Monitoring Key Vault Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seed-monitoring-key-vault-once.yml'

permissions:
  contents: read
  id-token: write

env:
  AZURE_KEY_VAULT_NAME: dsg-shared-secrets
  AZURE_RESOURCE_GROUP: rg-t.dealer01-0468

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Resolve governed Azure OIDC identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          file='config/azure-github-oidc-identity.json'
          client_id="$(jq -er '.clientId' "$file")"
          tenant_id="$(jq -er '.tenantId' "$file")"
          subscription_id="$(jq -er '.subscriptionId' "$file")"
          test "$(jq -er '.resourceGroup' "$file")" = "$AZURE_RESOURCE_GROUP"
          echo "::add-mask::$client_id"
          echo "::add-mask::$tenant_id"
          echo "::add-mask::$subscription_id"
          echo "client_id=$client_id" >> "$GITHUB_OUTPUT"
          echo "tenant_id=$tenant_id" >> "$GITHUB_OUTPUT"
          echo "subscription_id=$subscription_id" >> "$GITHUB_OUTPUT"

      - name: Login to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ steps.identity.outputs.client_id }}
          tenant-id: ${{ steps.identity.outputs.tenant_id }}
          subscription-id: ${{ steps.identity.outputs.subscription_id }}

      - name: Seed monitoring secrets without printing values
        shell: bash
        env:
          MONITORING_API_KEY: ${{ secrets.MONITORING_API_KEY }}
          MONITORING_ORG_ID: ${{ secrets.MONITORING_ORG_ID }}
        run: |
          set -euo pipefail
          test -n "${MONITORING_API_KEY:-}" || { echo '::error::MONITORING_API_KEY_REQUIRED'; exit 1; }
          test -n "${MONITORING_ORG_ID:-}" || { echo '::error::MONITORING_ORG_ID_REQUIRED'; exit 1; }
          az keyvault show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_KEY_VAULT_NAME" \
            --only-show-errors --output none
          az keyvault secret set \
            --vault-name "$AZURE_KEY_VAULT_NAME" \
            --name monitoring-api-key \
            --value "$MONITORING_API_KEY" \
            --only-show-errors --output none
          az keyvault secret set \
            --vault-name "$AZURE_KEY_VAULT_NAME" \
            --name monitoring-org-id \
            --value "$MONITORING_ORG_ID" \
            --only-show-errors --output none

      - name: Verify secret names only
        shell: bash
        run: |
          set -euo pipefail
          test "$(az keyvault secret show --vault-name "$AZURE_KEY_VAULT_NAME" --name monitoring-api-key --query name -o tsv)" = 'monitoring-api-key'
          test "$(az keyvault secret show --vault-name "$AZURE_KEY_VAULT_NAME" --name monitoring-org-id --query name -o tsv)" = 'monitoring-org-id'
          {
            echo '## Monitoring secret bootstrap'
            echo '- vault: dsg-shared-secrets'
            echo '- monitoring-api-key: present'
            echo '- monitoring-org-id: present'
            echo '- values printed: no'
          } >> "$GITHUB_STEP_SUMMARY"
