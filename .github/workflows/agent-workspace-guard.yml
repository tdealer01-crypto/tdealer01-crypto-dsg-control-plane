name: Agent Workspace Guard

on:
  push:
    branches:
      - 'agent-workspace/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-development-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AGENT_WORKSPACE_ENV: development
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check workspace and release script syntax
        run: |
          node --check scripts/bootstrap-agent-workspace.mjs
          node --check scripts/verify-agent-workspace-boundary.mjs
          node --check scripts/lib/agent-workspace-release.mjs
          node --check scripts/approve-agent-workspace-promotion.mjs
          node --check scripts/finalize-agent-workspace-promotion.mjs
      - name: Verify development and production boundaries
        run: node scripts/verify-agent-workspace-boundary.mjs origin/main
      - name: Typecheck
        run: npm run typecheck
      - name: Agent workspace policy tests
        run: npx vitest run tests/unit/agent-workspace/policy.test.ts
      - name: Migration tests
        run: npm run test:migrations
      - name: Unit suite
        run: npm run test:unit
