name: Verified Software E2E

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: "Request production release after verification and DSG PASS"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify-software:
    name: Scan → Test → Benchmark → Evidence Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      gate_status: ${{ steps.meta.outputs.gate_status }}
      evidence_bundle_hash: ${{ steps.meta.outputs.evidence_bundle_hash }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare evidence directory
        run: mkdir -p .dsg-evidence

      - name: Static scan
        id: scan
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee .dsg-evidence/scan.log

      - name: Type check
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee .dsg-evidence/typecheck.log

      - name: Unit tests
        id: unit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test:unit -- --reporter=dot 2>&1 | tee .dsg-evidence/unit.log

      - name: Production build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee .dsg-evidence/build.log

      - name: Dependency security scan
        id: security
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm audit --omit=dev --audit-level=high --json 2>&1 | tee .dsg-evidence/security.log

      - name: Benchmark
        id: benchmark
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run benchmark 2>&1 | tee .dsg-evidence/benchmark.log

      - name: Build hashed evidence bundle
        if: always()
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          UNIT_OUTCOME: ${{ steps.unit.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SECURITY_OUTCOME: ${{ steps.security.outcome }}
          BENCHMARK_OUTCOME: ${{ steps.benchmark.outcome }}
        run: node scripts/build-software-evidence.mjs

      - name: Evaluate deterministic software evidence gate
        if: always()
        continue-on-error: true
        run: >-
          node scripts/verified-software-gate.mjs
          --input .dsg-evidence/software-evidence.json
          --output .dsg-evidence/software-gate.json

      - name: Read gate metadata
        id: meta
        if: always()
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFile } from 'node:fs/promises';
          const gate = JSON.parse(await readFile('.dsg-evidence/software-gate.json', 'utf8'));
          process.stdout.write(`gate_status=${gate.status}\n`);
          process.stdout.write(`evidence_bundle_hash=${gate.evidenceBundleHash}\n`);
          NODE

      - name: Print machine-readable gate result
        if: always()
        run: cat .dsg-evidence/software-gate.json

      - name: User-facing result
        if: always()
        run: |
          echo '## DSG Verified Software E2E' >> "$GITHUB_STEP_SUMMARY"
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFile } from 'node:fs/promises';
          const gate = JSON.parse(await readFile('.dsg-evidence/software-gate.json', 'utf8'));
          console.log(`\n**Result:** ${gate.status}`);
          console.log(`\n**Evidence:** \`${gate.evidenceBundleHash}\``);
          if (gate.blockers.length) {
            console.log('\n**Must fix:**');
            for (const blocker of gate.blockers) console.log(`- ${blocker}`);
          }
          if (gate.warnings.length) {
            console.log('\n**Warnings:**');
            for (const warning of gate.warnings) console.log(`- ${warning}`);
          }
          console.log(`\n**Next:** ${gate.nextAction}`);
          console.log(`\n> ${gate.truthBoundary}`);
          NODE

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsg-software-evidence-${{ github.run_id }}
          path: .dsg-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Enforce evidence gate
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const gate = JSON.parse(await readFile('.dsg-evidence/software-gate.json', 'utf8'));
          if (gate.status !== 'READY_FOR_DSG_GATE') {
            console.error(JSON.stringify(gate, null, 2));
            console.error(`BLOCK: ${gate.blockers.join(', ')}`);
            process.exit(1);
          }
          console.log('READY_FOR_DSG_GATE');
          NODE

  dsg-production-gate:
    name: Canonical DSG Production Gate
    needs: verify-software
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.release == true &&
      github.ref == 'refs/heads/main' &&
      needs.verify-software.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      gate_status: ${{ steps.meta.outputs.gate_status }}
      proof_hash: ${{ steps.meta.outputs.proof_hash }}

    steps:
      - uses: actions/checkout@v4

      - name: Require real DSG credential
        env:
          DSG_API_KEY: ${{ secrets.DSG_API_KEY }}
        run: |
          test -n "$DSG_API_KEY" || {
            echo 'DSG_API_KEY missing: production authorization is unverified.' >&2
            exit 1
          }

      - name: Build exact release context
        env:
          COMMIT_SHA: ${{ github.sha }}
          SOFTWARE_EVIDENCE_HASH: ${{ needs.verify-software.outputs.evidence_bundle_hash }}
        run: |
          mkdir -p .dsg-release
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          const body = {
            target: 'production',
            commit: process.env.COMMIT_SHA,
            softwareEvidenceBundleHash: process.env.SOFTWARE_EVIDENCE_HASH,
            requestedEffect: 'deploy_production',
          };
          await writeFile('.dsg-release/context.json', `${JSON.stringify(body, null, 2)}\n`);
          NODE

      - name: Obtain remote DSG PASS
        env:
          DSG_API_KEY: ${{ secrets.DSG_API_KEY }}
          DSG_CONTROL_PLANE_URL: ${{ secrets.DSG_CONTROL_PLANE_URL }}
        shell: bash
        run: |
          set -o pipefail
          node skills/dsg-production-gate/scripts/dsg-production-gate.mjs evaluate \
            --risk high \
            --action deploy_production \
            --plan-id "software-release-${{ github.sha }}" \
            --context-file .dsg-release/context.json \
            | tee .dsg-release/dsg-gate.json

      - name: Read DSG proof metadata
        id: meta
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFile } from 'node:fs/promises';
          const gate = JSON.parse(await readFile('.dsg-release/dsg-gate.json', 'utf8'));
          if (gate.gateStatus !== 'PASS' || gate.canProceed !== true) process.exit(1);
          process.stdout.write(`gate_status=${gate.gateStatus}\n`);
          process.stdout.write(`proof_hash=${gate.proofHash ?? ''}\n`);
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: dsg-production-gate-${{ github.run_id }}
          path: .dsg-release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  human-release-and-deploy:
    name: Human Release → Deploy → Observe → Receipt
    needs: [verify-software, dsg-production-gate]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.release == true &&
      github.ref == 'refs/heads/main' &&
      needs.dsg-production-gate.outputs.gate_status == 'PASS'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Require deploy credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo 'VERCEL_TOKEN missing' >&2; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo 'VERCEL_ORG_ID missing' >&2; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo 'VERCEL_PROJECT_ID missing' >&2; exit 1; }

      - name: Controlled production deploy
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .dsg-release
          DEPLOY_OUTPUT=$(npx vercel deploy --prod --yes --token "$VERCEL_TOKEN")
          printf '%s\n' "$DEPLOY_OUTPUT" | tee .dsg-release/deploy.log
          DEPLOY_URL=$(printf '%s\n' "$DEPLOY_OUTPUT" | grep -Eo 'https://[^[:space:]]+' | tail -1)
          test -n "$DEPLOY_URL" || { echo 'Deployment URL not found' >&2; exit 1; }
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

      - name: Observe production postconditions
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$DEPLOY_URL/api/health" | tee .dsg-release/health.json
          curl --fail --silent --show-error "$DEPLOY_URL/api/readiness" | tee .dsg-release/readiness.json
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const body = JSON.parse(await readFile('.dsg-release/readiness.json', 'utf8'));
          if (body.ready !== true) process.exit(1);
          NODE

      - name: Create deterministic release receipt
        env:
          COMMIT_SHA: ${{ github.sha }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          SOFTWARE_EVIDENCE_HASH: ${{ needs.verify-software.outputs.evidence_bundle_hash }}
          DSG_PROOF_HASH: ${{ needs.dsg-production-gate.outputs.proof_hash }}
        run: node scripts/create-software-release-receipt.mjs

      - name: Upload release proof
        uses: actions/upload-artifact@v4
        with:
          name: dsg-release-proof-${{ github.run_id }}
          path: .dsg-release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - name: Release summary
        run: |
          echo '## DSG Verified Release' >> "$GITHUB_STEP_SUMMARY"
          echo '- Software evidence: READY_FOR_DSG_GATE' >> "$GITHUB_STEP_SUMMARY"
          echo '- DSG production gate: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Human release: workflow dispatch + production environment' >> "$GITHUB_STEP_SUMMARY"
          echo '- Controlled deploy: completed' >> "$GITHUB_STEP_SUMMARY"
          echo '- Observed readiness: ready=true' >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- DSG proof hash: ${{ needs.dsg-production-gate.outputs.proof_hash }}" >> "$GITHUB_STEP_SUMMARY"
