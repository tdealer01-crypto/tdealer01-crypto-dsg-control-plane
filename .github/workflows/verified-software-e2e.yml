name: Verified Software E2E

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: "After verification and DSG PASS, request the production release job"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify-software:
    name: Scan → Test → Benchmark → Evidence Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      gate_status: ${{ steps.gate_meta.outputs.status }}
      evidence_bundle_hash: ${{ steps.gate_meta.outputs.evidence_bundle_hash }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare evidence directory
        run: mkdir -p .dsg-evidence

      - name: Static scan
        id: scan
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee .dsg-evidence/scan.log

      - name: Type check
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee .dsg-evidence/typecheck.log

      - name: Unit tests
        id: unit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test:unit -- --reporter=dot 2>&1 | tee .dsg-evidence/unit.log

      - name: Production build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee .dsg-evidence/build.log

      - name: Dependency security scan
        id: security
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm audit --omit=dev --audit-level=high --json 2>&1 | tee .dsg-evidence/security.log

      - name: Benchmark
        id: benchmark
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run benchmark 2>&1 | tee .dsg-evidence/benchmark.log

      - name: Build evidence bundle
        if: always()
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          UNIT_OUTCOME: ${{ steps.unit.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SECURITY_OUTCOME: ${{ steps.security.outcome }}
          BENCHMARK_OUTCOME: ${{ steps.benchmark.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFile, writeFile } from 'node:fs/promises';

          const hashFile = async (name) => {
            let body = '';
            try { body = await readFile(`.dsg-evidence/${name}.log`, 'utf8'); } catch {}
            return `sha256:${createHash('sha256').update(body).digest('hex')}`;
          };
          const status = (outcome) => outcome === 'success' ? 'PASS' : 'FAIL';
          const requiredOutcomes = [
            process.env.SCAN_OUTCOME,
            process.env.TYPECHECK_OUTCOME,
            process.env.UNIT_OUTCOME,
            process.env.BUILD_OUTCOME,
            process.env.SECURITY_OUTCOME,
            process.env.BENCHMARK_OUTCOME,
          ];
          const open = requiredOutcomes.filter((value) => value !== 'success').length;

          const evidence = {
            schema: 'dsg.software-evidence.v1',
            commit: process.env.COMMIT_SHA,
            findings: { open, repaired: 0 },
            repair: {
              status: open === 0 ? 'NOT_REQUIRED' : 'PENDING',
              attempts: open === 0 ? 0 : 1,
              maxAttempts: 5,
            },
            stages: {
              scan: {
                status: status(process.env.SCAN_OUTCOME),
                provenance: 'STATICALLY_VERIFIED',
                evidenceHash: await hashFile('scan'),
              },
              typecheck: {
                status: status(process.env.TYPECHECK_OUTCOME),
                provenance: 'MEASURED',
                evidenceHash: await hashFile('typecheck'),
              },
              unit: {
                status: status(process.env.UNIT_OUTCOME),
                provenance: 'MEASURED',
                evidenceHash: await hashFile('unit'),
              },
              build: {
                status: status(process.env.BUILD_OUTCOME),
                provenance: 'MEASURED',
                evidenceHash: await hashFile('build'),
              },
              security: {
                status: status(process.env.SECURITY_OUTCOME),
                provenance: 'STATICALLY_VERIFIED',
                evidenceHash: await hashFile('security'),
              },
              benchmark: {
                status: status(process.env.BENCHMARK_OUTCOME),
                required: true,
                provenance: 'MEASURED',
                evidenceHash: await hashFile('benchmark'),
              },
            },
          };
          await writeFile('.dsg-evidence/software-evidence.json', `${JSON.stringify(evidence, null, 2)}\n`);
          NODE

      - name: Evaluate deterministic software evidence gate
        id: gate
        if: always()
        continue-on-error: true
        run: |
          node scripts/verified-software-gate.mjs \
            --input .dsg-evidence/software-evidence.json \
            --output .dsg-evidence/software-gate.json

      - name: Read gate metadata
        id: gate_meta
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const gate = JSON.parse(await readFile('.dsg-evidence/software-gate.json', 'utf8'));
          console.log(`status=${gate.status}`);
          console.log(`evidenceBundleHash=${gate.evidenceBundleHash}`);
          process.stdout.write(`status=${gate.status}\n`);
          process.stdout.write(`evidence_bundle_hash=${gate.evidenceBundleHash}\n`);
          NODE
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFile } from 'node:fs/promises';
          const gate = JSON.parse(await readFile('.dsg-evidence/software-gate.json', 'utf8'));
          process.stdout.write(`status=${gate.status}\n`);
          process.stdout.write(`evidence_bundle_hash=${gate.evidenceBundleHash}\n`);
          NODE

      - name: Write user-facing result
        if: always()
        run: |
          echo '## DSG Verified Software E2E' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFile } from 'node:fs/promises';
          const gate = JSON.parse(await readFile('.dsg-evidence/software-gate.json', 'utf8'));
          console.log(`**Result:** ${gate.status}`);
          console.log('');
          console.log(`**Evidence:** \`${gate.evidenceBundleHash}\``);
          console.log('');
          if (gate.blockers.length) {
            console.log('**Must fix:**');
            for (const blocker of gate.blockers) console.log(`- ${blocker}`);
            console.log('');
          }
          if (gate.warnings.length) {
            console.log('**Warnings:**');
            for (const warning of gate.warnings) console.log(`- ${warning}`);
            console.log('');
          }
          console.log(`**Next:** ${gate.nextAction}`);
          console.log('');
          console.log(`> ${gate.truthBoundary}`);
          NODE

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsg-software-evidence-${{ github.run_id }}
          path: .dsg-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce software evidence gate
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const gate = JSON.parse(await readFile('.dsg-evidence/software-gate.json', 'utf8'));
          if (gate.status !== 'READY_FOR_DSG_GATE') {
            console.error(`Software evidence gate blocked release: ${gate.blockers.join(', ')}`);
            process.exit(1);
          }
          console.log('Software evidence is ready for the canonical DSG production gate.');
          NODE

  dsg-production-gate:
    name: Canonical DSG Gate
    needs: verify-software
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.release == true &&
      github.ref == 'refs/heads/main' &&
      needs.verify-software.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      proof_hash: ${{ steps.meta.outputs.proof_hash }}
      gate_status: ${{ steps.meta.outputs.gate_status }}

    steps:
      - uses: actions/checkout@v4

      - name: Require DSG production credential
        env:
          DSG_API_KEY: ${{ secrets.DSG_API_KEY }}
        run: |
          test -n "$DSG_API_KEY" || {
            echo 'DSG_API_KEY is missing; production authorization is unverified.' >&2
            exit 1
          }

      - name: Build canonical action context
        env:
          COMMIT_SHA: ${{ github.sha }}
          EVIDENCE_BUNDLE_HASH: ${{ needs.verify-software.outputs.evidence_bundle_hash }}
        run: |
          mkdir -p .dsg-release
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          const context = {
            target: 'production',
            commit: process.env.COMMIT_SHA,
            softwareEvidenceBundleHash: process.env.EVIDENCE_BUNDLE_HASH,
            requestedEffect: 'deploy_production',
          };
          await writeFile('.dsg-release/context.json', `${JSON.stringify(context, null, 2)}\n`);
          NODE

      - name: Obtain real DSG production decision
        env:
          DSG_API_KEY: ${{ secrets.DSG_API_KEY }}
          DSG_CONTROL_PLANE_URL: ${{ secrets.DSG_CONTROL_PLANE_URL }}
        shell: bash
        run: |
          set -o pipefail
          node skills/dsg-production-gate/scripts/dsg-production-gate.mjs evaluate \
            --risk high \
            --action deploy_production \
            --plan-id "software-release-${{ github.sha }}" \
            --context-file .dsg-release/context.json \
            | tee .dsg-release/dsg-gate.json

      - name: Read DSG proof metadata
        id: meta
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFile } from 'node:fs/promises';
          const gate = JSON.parse(await readFile('.dsg-release/dsg-gate.json', 'utf8'));
          if (gate.gateStatus !== 'PASS' || gate.canProceed !== true) process.exit(1);
          process.stdout.write(`gate_status=${gate.gateStatus}\n`);
          process.stdout.write(`proof_hash=${gate.proofHash ?? ''}\n`);
          NODE

      - name: Upload DSG authorization evidence
        uses: actions/upload-artifact@v4
        with:
          name: dsg-production-gate-${{ github.run_id }}
          path: .dsg-release/
          if-no-files-found: error
          retention-days: 90

  human-release-and-deploy:
    name: Human Release → Controlled Deploy → Postconditions
    needs: [verify-software, dsg-production-gate]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.release == true &&
      github.ref == 'refs/heads/main' &&
      needs.dsg-production-gate.outputs.gate_status == 'PASS'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require deployment credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo 'VERCEL_TOKEN missing' >&2; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo 'VERCEL_ORG_ID missing' >&2; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo 'VERCEL_PROJECT_ID missing' >&2; exit 1; }

      - name: Controlled production deploy
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .dsg-release
          DEPLOY_OUTPUT=$(npx vercel deploy --prod --yes --token "$VERCEL_TOKEN")
          printf '%s\n' "$DEPLOY_OUTPUT" | tee .dsg-release/deploy.log
          DEPLOY_URL=$(printf '%s\n' "$DEPLOY_OUTPUT" | grep -Eo 'https://[^[:space:]]+' | tail -1)
          test -n "$DEPLOY_URL" || { echo 'Deployment URL not found' >&2; exit 1; }
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

      - name: Observe production postconditions
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$DEPLOY_URL/api/health" | tee .dsg-release/health.json
          curl --fail --silent --show-error "$DEPLOY_URL/api/readiness" | tee .dsg-release/readiness.json
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const readiness = JSON.parse(await readFile('.dsg-release/readiness.json', 'utf8'));
          if (readiness.ready !== true) {
            console.error('Postcondition failed: /api/readiness did not return ready=true');
            process.exit(1);
          }
          NODE

      - name: Create deterministic deployment receipt
        env:
          COMMIT_SHA: ${{ github.sha }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          SOFTWARE_EVIDENCE_HASH: ${{ needs.verify-software.outputs.evidence_bundle_hash }}
          DSG_PROOF_HASH: ${{ needs.dsg-production-gate.outputs.proof_hash }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFile, writeFile } from 'node:fs/promises';
          const hash = (value) => `sha256:${createHash('sha256').update(value).digest('hex')}`;
          const health = await readFile('.dsg-release/health.json', 'utf8');
          const readiness = await readFile('.dsg-release/readiness.json', 'utf8');
          const body = {
            schema: 'dsg.software-release-receipt.v1',
            commit: process.env.COMMIT_SHA,
            deploymentUrl: process.env.DEPLOY_URL,
            softwareEvidenceBundleHash: process.env.SOFTWARE_EVIDENCE_HASH,
            dsgProofHash: process.env.DSG_PROOF_HASH || null,
            observedPostconditions: {
              healthHash: hash(health),
              readinessHash: hash(readiness),
              readiness: JSON.parse(readiness).ready === true,
            },
          };
          const canonical = JSON.stringify(body, Object.keys(body).sort());
          const receipt = { ...body, receiptHash: hash(canonical) };
          await writeFile('.dsg-release/release-receipt.json', `${JSON.stringify(receipt, null, 2)}\n`);
          NODE

      - name: Upload release proof
        uses: actions/upload-artifact@v4
        with:
          name: dsg-release-proof-${{ github.run_id }}
          path: .dsg-release/
          if-no-files-found: error
          retention-days: 90

      - name: Release summary
        run: |
          echo '## DSG Release Result' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- Software evidence: PASS → READY_FOR_DSG_GATE' >> "$GITHUB_STEP_SUMMARY"
          echo '- DSG production gate: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Human release point: GitHub production environment / manual dispatch' >> "$GITHUB_STEP_SUMMARY"
          echo '- Controlled deploy: completed' >> "$GITHUB_STEP_SUMMARY"
          echo '- Postcondition /api/readiness: ready=true' >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- DSG proof hash: ${{ needs.dsg-production-gate.outputs.proof_hash }}" >> "$GITHUB_STEP_SUMMARY"
