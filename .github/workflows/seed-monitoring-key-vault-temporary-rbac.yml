name: Seed Monitoring Key Vault Temporary RBAC

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seed-monitoring-key-vault-temporary-rbac.yml'

permissions:
  contents: read
  id-token: write

env:
  AZURE_KEY_VAULT_NAME: dsg-shared-secrets
  AZURE_RESOURCE_GROUP: rg-t.dealer01-0468

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Resolve governed Azure OIDC identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          file='config/azure-github-oidc-identity.json'
          client_id="$(jq -er '.clientId' "$file")"
          tenant_id="$(jq -er '.tenantId' "$file")"
          subscription_id="$(jq -er '.subscriptionId' "$file")"
          test "$(jq -er '.resourceGroup' "$file")" = "$AZURE_RESOURCE_GROUP"
          echo "::add-mask::$client_id"
          echo "::add-mask::$tenant_id"
          echo "::add-mask::$subscription_id"
          echo "client_id=$client_id" >> "$GITHUB_OUTPUT"
          echo "tenant_id=$tenant_id" >> "$GITHUB_OUTPUT"
          echo "subscription_id=$subscription_id" >> "$GITHUB_OUTPUT"

      - name: Login to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ steps.identity.outputs.client_id }}
          tenant-id: ${{ steps.identity.outputs.tenant_id }}
          subscription-id: ${{ steps.identity.outputs.subscription_id }}

      - name: Acquire temporary Key Vault seed role
        id: rbac
        shell: bash
        run: |
          set -euo pipefail
          vault_id="$(az keyvault show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_KEY_VAULT_NAME" --query id -o tsv)"
          arm_token="$(az account get-access-token --resource https://management.azure.com/ --query accessToken -o tsv)"
          principal_id="$(TOKEN="$arm_token" python3 - <<'PY'
          import base64, json, os
          token = os.environ['TOKEN']
          part = token.split('.')[1]
          part += '=' * (-len(part) % 4)
          payload = json.loads(base64.urlsafe_b64decode(part.encode()))
          oid = payload.get('oid')
          if not oid:
              raise SystemExit('OID claim not found')
          print(oid)
          PY
          )"
          unset arm_token
          echo "::add-mask::$principal_id"
          existing_id="$(az role assignment list --assignee-object-id "$principal_id" --scope "$vault_id" --role 'Key Vault Secrets Officer' --query '[0].id' -o tsv)"
          if [[ -n "$existing_id" ]]; then
            echo 'created=false' >> "$GITHUB_OUTPUT"
            echo "assignment_id=$existing_id" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          assignment_id="$(az role assignment create \
            --assignee-object-id "$principal_id" \
            --assignee-principal-type ServicePrincipal \
            --role 'Key Vault Secrets Officer' \
            --scope "$vault_id" \
            --query id -o tsv)"
          test -n "$assignment_id"
          echo 'created=true' >> "$GITHUB_OUTPUT"
          echo "assignment_id=$assignment_id" >> "$GITHUB_OUTPUT"

      - name: Seed monitoring secrets without printing values
        shell: bash
        env:
          MONITORING_API_KEY: ${{ secrets.MONITORING_API_KEY }}
          MONITORING_ORG_ID: ${{ secrets.MONITORING_ORG_ID }}
        run: |
          set -euo pipefail
          test -n "${MONITORING_API_KEY:-}" || { echo '::error::MONITORING_API_KEY_REQUIRED'; exit 1; }
          test -n "${MONITORING_ORG_ID:-}" || { echo '::error::MONITORING_ORG_ID_REQUIRED'; exit 1; }
          seed_one() {
            local name="$1" value="$2"
            for attempt in $(seq 1 12); do
              if az keyvault secret set --vault-name "$AZURE_KEY_VAULT_NAME" --name "$name" --value "$value" --only-show-errors --output none 2>/tmp/kv-error; then
                return 0
              fi
              if ! grep -q 'ForbiddenByRbac\|not authorized' /tmp/kv-error; then
                cat /tmp/kv-error >&2
                return 1
              fi
              sleep 5
            done
            cat /tmp/kv-error >&2
            return 1
          }
          seed_one monitoring-api-key "$MONITORING_API_KEY"
          seed_one monitoring-org-id "$MONITORING_ORG_ID"
          rm -f /tmp/kv-error

      - name: Verify secret names only
        shell: bash
        run: |
          set -euo pipefail
          test "$(az keyvault secret show --vault-name "$AZURE_KEY_VAULT_NAME" --name monitoring-api-key --query name -o tsv)" = 'monitoring-api-key'
          test "$(az keyvault secret show --vault-name "$AZURE_KEY_VAULT_NAME" --name monitoring-org-id --query name -o tsv)" = 'monitoring-org-id'
          {
            echo '## Monitoring secret bootstrap'
            echo '- vault: dsg-shared-secrets'
            echo '- monitoring-api-key: present'
            echo '- monitoring-org-id: present'
            echo '- values printed: no'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary Key Vault seed role
        if: always() && steps.rbac.outputs.created == 'true'
        shell: bash
        env:
          ASSIGNMENT_ID: ${{ steps.rbac.outputs.assignment_id }}
        run: |
          set -euo pipefail
          test -n "$ASSIGNMENT_ID"
          az role assignment delete --ids "$ASSIGNMENT_ID" --only-show-errors
