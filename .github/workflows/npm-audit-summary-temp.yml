name: TEMP safe npm audit repair

on:
  pull_request:
    paths:
      - '.github/workflows/npm-audit-summary-temp.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Pin safe transitive patches
        run: |
          npm pkg set 'overrides.js-yaml=4.3.1'
          npm pkg set 'overrides.nanoid=3.3.17'
          npm install --package-lock-only --ignore-scripts
      - name: Verify high/critical audit is clear
        run: npm audit --audit-level=high
      - name: Commit registry-generated lockfile
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'No dependency repair changes required.'
            exit 0
          fi
          git commit -m 'fix(security): patch js-yaml and nanoid audit findings'
          git push origin HEAD:${{ github.head_ref }}
