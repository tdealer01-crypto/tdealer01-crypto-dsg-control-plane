name: TEMP npm audit blocker summary

on:
  pull_request:
    paths:
      - '.github/workflows/npm-audit-summary-temp.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Print high and critical audit blockers only
        shell: bash
        run: |
          npm audit --json > audit.json || true
          node <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          const blockers = Object.entries(audit.vulnerabilities || {})
            .filter(([, v]) => v.severity === 'high' || v.severity === 'critical')
            .map(([name, v]) => ({
              name,
              severity: v.severity,
              direct: Boolean(v.isDirect),
              via: (v.via || []).map((x) => typeof x === 'string' ? x : ({ name: x.name, title: x.title, url: x.url, range: x.range })),
              range: v.range,
              nodes: v.nodes,
              fixAvailable: v.fixAvailable,
            }));
          console.log(JSON.stringify({ metadata: audit.metadata?.vulnerabilities, blockers }, null, 2));
          NODE
