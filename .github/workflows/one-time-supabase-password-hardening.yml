name: One-time Supabase password hardening

on:
  push:
    branches:
      - fix/supabase-db-password-hardening
    paths:
      - '.github/workflows/one-time-supabase-password-hardening.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: fix/supabase-db-password-hardening
          fetch-depth: 0

      - name: Apply deterministic hardening patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          PROJECT_REF = 'zeyguilldygozufpgxms'

          def expr(name: str) -> str:
              return '$' + '{{ secrets.' + name + ' }}'

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          # Production readiness: bind secrets through env, require the access token,
          # use the canonical project fallback, and pass the password explicitly.
          path = '.github/workflows/production-readiness.yml'
          p = Path(path)
          text = p.read_text()
          text = text.replace(
              '# - SUPABASE_DB_PASSWORD\n# - SUPABASE_PROJECT_REF\n',
              '# - SUPABASE_ACCESS_TOKEN\n# - SUPABASE_DB_PASSWORD\n# - SUPABASE_PROJECT_REF (optional override; project ID fallback is configured)\n',
              1,
          )
          marker = '      - name: Check available secrets\n        id: check\n        run: |\n'
          env_block = (
              '      - name: Check available secrets\n'
              '        id: check\n'
              '        env:\n'
              f'          SUPABASE_ACCESS_TOKEN: {expr("SUPABASE_ACCESS_TOKEN")}\n'
              f'          SUPABASE_DB_PASSWORD: {expr("SUPABASE_DB_PASSWORD")}\n'
              "          SUPABASE_PROJECT_REF: $" + "{{ secrets.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_ID || '" + PROJECT_REF + "' }}\n"
              '        run: |\n'
          )
          if text.count(marker) != 1:
              raise SystemExit(f'{path}: preflight marker mismatch')
          text = text.replace(marker, env_block, 1)
          old_check = (
              '          if [ -n "' + expr('SUPABASE_DB_PASSWORD') + '" ] && '
              '[ -n "' + expr('SUPABASE_PROJECT_REF') + '" ]; then\n'
          )
          new_check = (
              '          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] && '
              '[ -n "${SUPABASE_DB_PASSWORD:-}" ] && '
              '[ -n "${SUPABASE_PROJECT_REF:-}" ]; then\n'
          )
          if text.count(old_check) != 1:
              raise SystemExit(f'{path}: Supabase preflight condition mismatch')
          text = text.replace(old_check, new_check, 1)

          db_marker = (
              "  db-migration-check:\n"
              "    name: Database Migration Check\n"
              "    runs-on: ubuntu-latest\n"
              "    needs: preflight-secrets-check\n"
              "    if: needs.preflight-secrets-check.outputs.has_supabase == 'true'\n"
              "    steps:\n"
          )
          db_env = (
              "  db-migration-check:\n"
              "    name: Database Migration Check\n"
              "    runs-on: ubuntu-latest\n"
              "    needs: preflight-secrets-check\n"
              "    if: needs.preflight-secrets-check.outputs.has_supabase == 'true'\n"
              "    env:\n"
              f'      SUPABASE_ACCESS_TOKEN: {expr("SUPABASE_ACCESS_TOKEN")}\n'
              f'      SUPABASE_DB_PASSWORD: {expr("SUPABASE_DB_PASSWORD")}\n'
              "      SUPABASE_PROJECT_REF: $" + "{{ secrets.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_ID || '" + PROJECT_REF + "' }}\n"
              "    steps:\n"
          )
          if text.count(db_marker) != 1:
              raise SystemExit(f'{path}: migration job marker mismatch')
          text = text.replace(db_marker, db_env, 1)

          old_link = (
              '      - name: Link to Supabase project\n'
              '        run: |\n'
              '          echo "' + expr('SUPABASE_DB_PASSWORD') + '" | supabase link --project-ref ' + expr('SUPABASE_PROJECT_REF') + '\n'
          )
          new_link = (
              '      - name: Link to Supabase project\n'
              '        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"\n'
          )
          if text.count(old_link) != 1:
              raise SystemExit(f'{path}: link step mismatch')
          text = text.replace(old_link, new_link, 1)
          p.write_text(text)

          # Governed platform deploy: project ref has the same fallback and password is explicit.
          path = '.github/workflows/dsg-platform-deploy.yml'
          p = Path(path)
          text = p.read_text()
          old_ref = '      SUPABASE_PROJECT_REF: ' + expr('SUPABASE_PROJECT_REF')
          new_ref = "      SUPABASE_PROJECT_REF: $" + "{{ secrets.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_ID || '" + PROJECT_REF + "' }}"
          if text.count(old_ref) != 1:
              raise SystemExit(f'{path}: project ref binding mismatch')
          text = text.replace(old_ref, new_ref, 1)
          old_link = '        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"'
          new_link = '        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"'
          if text.count(old_link) != 1:
              raise SystemExit(f'{path}: link command mismatch')
          text = text.replace(old_link, new_link, 1)
          p.write_text(text)

          # MCP deployment readiness should require actual secrets, not a redundant project-ref secret.
          replace_once(
              'lib/mcp/platform-deploy-tools.ts',
              "  supabase: ['SUPABASE_ACCESS_TOKEN', 'SUPABASE_PROJECT_REF', 'SUPABASE_DB_PASSWORD'],",
              "  supabase: ['SUPABASE_ACCESS_TOKEN', 'SUPABASE_DB_PASSWORD'],",
          )

          # Replace the legacy bootstrap that embedded the raw password in a Postgres URI
          # and duplicated canonical migrations with a migration-only, fail-closed bootstrap.
          Path('scripts/supabase-init.sh').write_text(f'''#!/usr/bin/env bash
# Link the canonical DSG Supabase project and apply repository migrations.
# SUPABASE_DB_PASSWORD must be the raw database password; do not percent-encode it here.

set -euo pipefail

: "${{SUPABASE_ACCESS_TOKEN:?SUPABASE_ACCESS_TOKEN is required}}"
: "${{SUPABASE_DB_PASSWORD:?SUPABASE_DB_PASSWORD is required}}"

SUPABASE_PROJECT_REF="${{SUPABASE_PROJECT_REF:-${{SUPABASE_PROJECT_ID:-{PROJECT_REF}}}}}"

command -v supabase >/dev/null 2>&1 || {{
  echo "supabase CLI is required. Install it before running this script." >&2
  exit 1
}}

echo "Linking Supabase project: $SUPABASE_PROJECT_REF"
supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

echo "Applying canonical repository migrations..."
supabase db push --linked

echo "Supabase initialization complete."
''')

          # Documentation: make raw-secret vs connection-string encoding explicit.
          path = 'docs/INTEGRATION_SETUP.md'
          p = Path(path)
          text = p.read_text()
          old = 'SUPABASE_DB_PASSWORD                    # Database password from project settings\nSUPABASE_ACCESS_TOKEN                   # Personal access token for migrations\n'
          new = 'SUPABASE_DB_PASSWORD                    # Raw database password from project settings (server-only)\nSUPABASE_ACCESS_TOKEN                   # Personal access token for migrations\n'
          if text.count(old) != 1:
              raise SystemExit(f'{path}: secret documentation marker mismatch')
          text = text.replace(old, new, 1)
          note_marker = '2. **Database Password**:\n   - Settings → Database\n   - Copy: Database password from connection info\n'
          note_new = (
              '2. **Database Password**:\n'
              '   - Settings → Database\n'
              '   - Reset the database password if the existing value is unknown\n'
              '   - Store the raw value in `SUPABASE_DB_PASSWORD`\n'
              '   - Percent-encode it only when manually embedding it inside a PostgreSQL connection URI; do not percent-encode the GitHub secret itself\n'
          )
          if text.count(note_marker) != 1:
              raise SystemExit(f'{path}: password documentation marker mismatch')
          p.write_text(text.replace(note_marker, note_new, 1))
          PY

      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"' .github/workflows/production-readiness.yml
          grep -F 'supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"' .github/workflows/dsg-platform-deploy.yml
          ! grep -F 'postgresql://postgres:$SUPABASE_DB_PASSWORD@' scripts/supabase-init.sh

      - name: Commit hardened files and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-time-supabase-password-hardening.yml
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          git add .github/workflows/production-readiness.yml .github/workflows/dsg-platform-deploy.yml lib/mcp/platform-deploy-tools.ts scripts/supabase-init.sh docs/INTEGRATION_SETUP.md .github/workflows/one-time-supabase-password-hardening.yml
          git commit -m 'fix: harden Supabase database password handling'
          git push origin HEAD:fix/supabase-db-password-hardening
