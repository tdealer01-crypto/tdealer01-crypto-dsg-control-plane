name: CDK Deploy Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (dev, staging, prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      approval_required:
        description: 'Require protected GitHub Environment approval contract'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: Validate CDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: dsg-cdk-validate
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install CDK dependencies
        run: npm ci
        working-directory: infra/cdk

      - name: Build CDK
        run: npm run build
        working-directory: infra/cdk

      - name: Synthesize CDK
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: npx cdk synth "DSGOneStack-${ENVIRONMENT}" -c environment="${ENVIRONMENT}"
        working-directory: infra/cdk

      - name: Upload CloudFormation template
        uses: actions/upload-artifact@v4
        with:
          name: cdk-templates-${{ inputs.environment }}
          path: infra/cdk/cdk.out/

  plan:
    name: Plan Deployment
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: dsg-cdk-plan
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install dependencies
        run: npm ci
        working-directory: infra/cdk

      - name: Enforce production approval contract
        shell: bash
        run: |
          if [[ "${{ inputs.environment }}" == "prod" && "${{ inputs.approval_required }}" != "true" ]]; then
            echo "Production deployment requires approval_required=true."
            exit 1
          fi

      - name: Generate deployment plan
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          npx cdk diff "DSGOneStack-${ENVIRONMENT}" -c environment="${ENVIRONMENT}" > deployment-plan.txt 2>&1
          cat deployment-plan.txt
        working-directory: infra/cdk

      - name: Upload deployment plan
        uses: actions/upload-artifact@v4
        with:
          name: deployment-plan-${{ inputs.environment }}
          path: infra/cdk/deployment-plan.txt

  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    needs: [validate, plan]
    environment:
      name: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: dsg-cdk-deploy
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install dependencies
        run: npm ci
        working-directory: infra/cdk

      - name: Build CDK
        run: npm run build
        working-directory: infra/cdk

      - name: Deploy approved CDK stack
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          # Human approval belongs to the protected GitHub Environment.
          # CDK's interactive approval prompt cannot safely run in CI.
          npx cdk deploy "DSGOneStack-$ENVIRONMENT" \
            -c environment="$ENVIRONMENT" \
            --require-approval never \
            --outputs-file deployment-outputs.json
        working-directory: infra/cdk

      - name: Upload deployment outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-outputs-${{ inputs.environment }}
          path: infra/cdk/deployment-outputs.json

  verify:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: deploy
    if: success()
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: dsg-cdk-verify
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Capture CloudFormation evidence
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          mkdir -p evidence/aws
          aws cloudformation describe-stacks \
            --stack-name "DSGOneStack-${ENVIRONMENT}" \
            --region "$AWS_REGION" \
            --output json > evidence/aws/cloudformation-stack.json

          STACK_STATUS=$(jq -r '.Stacks[0].StackStatus' evidence/aws/cloudformation-stack.json)
          case "$STACK_STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE|IMPORT_COMPLETE)
              echo "CloudFormation stack status: $STACK_STATUS"
              ;;
            *)
              echo "Unexpected CloudFormation stack status: $STACK_STATUS"
              exit 1
              ;;
          esac

      - name: Capture ECS cluster evidence
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws ecs describe-clusters \
            --clusters "dsg-one-${ENVIRONMENT}" \
            --region "$AWS_REGION" \
            --output json > evidence/aws/ecs-cluster.json

          CLUSTER_STATUS=$(jq -r '.clusters[0].status // "MISSING"' evidence/aws/ecs-cluster.json)
          if [[ "$CLUSTER_STATUS" != "ACTIVE" ]]; then
            echo "ECS cluster is not ACTIVE: $CLUSTER_STATUS"
            exit 1
          fi
          echo "ECS cluster status: $CLUSTER_STATUS"

      - name: Write verification manifest
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          jq -n \
            --arg environment "$ENVIRONMENT" \
            --arg region "$AWS_REGION" \
            --arg run_id "${{ github.run_id }}" \
            --arg commit_sha "${{ github.sha }}" \
            '{
              status: "PASS",
              environment: $environment,
              region: $region,
              github_run_id: $run_id,
              commit_sha: $commit_sha,
              evidence: [
                "cloudformation-stack.json",
                "ecs-cluster.json"
              ]
            }' > evidence/aws/verification-manifest.json

      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: aws-verification-evidence-${{ inputs.environment }}
          path: evidence/aws/

  rollback-guidance:
    name: Rollback Guidance
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    steps:
      - name: Report safe recovery path
        run: |
          echo "Deployment failed. No automatic destructive rollback is executed."
          echo "Inspect CloudFormation events and the deployment-plan artifact before any delete/destroy action."
