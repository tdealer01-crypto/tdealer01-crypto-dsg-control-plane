name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "YES" to confirm production deployment'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  confirm-production:
    name: Confirm Production Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Verify Confirmation
        run: |
          if [[ "${{ github.event.inputs.confirm }}" != "YES" ]]; then
            echo "❌ Production deployment aborted - confirmation required"
            exit 1
          fi
          echo "✅ Production deployment confirmed"

  deploy-production:
    name: Deploy Production Stack
    runs-on: ubuntu-latest
    needs: confirm-production
    timeout-minutes: 45
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::121205961822:role/cdk-deploy-role
          role-session-name: github-actions-cdk-prod
          aws-region: us-east-1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Security Checks
        run: npm audit --audit-level=high || echo "⚠️ Audit warnings present"

      - name: Build CDK
        run: |
          export NODE_OPTIONS="--max_old_space_size=2048"
          npm run build
        working-directory: infra/cdk

      - name: Synthesize CDK
        run: npx cdk synth -c environment=prod
        working-directory: infra/cdk
        env:
          ENVIRONMENT: prod
          AWS_REGION: us-east-1

      - name: Deploy CDK Stack
        run: npx cdk deploy DSGOneStack-prod --require-approval=never --concurrency=5
        working-directory: infra/cdk
        env:
          ENVIRONMENT: prod
          AWS_REGION: us-east-1

      - name: Wait for Stack Stabilization
        run: |
          aws cloudformation wait stack-create-complete \
            --stack-name DSGOneStack-prod \
            --region us-east-1 || \
          aws cloudformation wait stack-update-complete \
            --stack-name DSGOneStack-prod \
            --region us-east-1
        continue-on-error: true

      - name: Verify Deployment
        run: |
          aws cloudformation describe-stacks \
            --stack-name DSGOneStack-prod \
            --region us-east-1 \
            --query 'Stacks[0].[StackStatus,CreationTime,LastUpdatedTime]'

      - name: Setup Production Secrets
        run: bash scripts/aws-secrets-manager-setup.sh
        env:
          ENVIRONMENT: prod
          AWS_REGION: us-east-1

      - name: Deploy Next.js to Production Vercel
        run: npx vercel deploy --prod --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Run Production Verification
        run: |
          bash scripts/verify-deployment.sh
        continue-on-error: true

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "🚀 Production Deployment ${{ job.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "Production deployment ${{ job.status }}\nCommit: ${{ github.sha }}\nAuthor: ${{ github.actor }}"
                  }
                }
              ]
            }
        continue-on-error: true
