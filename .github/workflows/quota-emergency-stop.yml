name: Emergency Actions Quota Guard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel-other-runs:
    name: Cancel queued and in-progress runs
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Disable remaining scheduled security workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method PUT "/repos/${GITHUB_REPOSITORY}/actions/workflows/security-evidence.yml/disable"
          echo "Disabled security-evidence.yml while Actions quota emergency mode is active."

      - name: Cancel all other queued/in-progress runs in this repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          THIS_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          for status in queued in_progress; do
            gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs?status=${status}&per_page=100" \
              --jq '.workflow_runs[].id' | while IFS= read -r run_id; do
                if [[ -z "$run_id" || "$run_id" == "$THIS_RUN_ID" ]]; then
                  continue
                fi
                echo "Cancelling run $run_id ($status)"
                gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
              done
          done

          sleep 5

          for status in queued in_progress; do
            gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs?status=${status}&per_page=100" \
              --jq '.workflow_runs[].id' | while IFS= read -r run_id; do
                if [[ -z "$run_id" || "$run_id" == "$THIS_RUN_ID" ]]; then
                  continue
                fi
                echo "Force-cancelling stuck run $run_id ($status)"
                gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/force-cancel" || true
              done
          done
