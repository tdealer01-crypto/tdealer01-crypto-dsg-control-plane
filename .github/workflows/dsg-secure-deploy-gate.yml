name: DSG Production Deploy Gate (Provider Unbound)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-target:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce production target binding
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const target = JSON.parse(await readFile('config/production-deployment-target.json', 'utf8'));
          console.log(JSON.stringify(target, null, 2));
          if (target.provider === 'UNBOUND' || target.productionDeployEnabled !== true) {
            console.error('BLOCK: production deployment target is not bound. Vercel and Render are retired targets.');
            process.exit(1);
          }
          console.log(`Production provider bound: ${target.provider}`);
          NODE
