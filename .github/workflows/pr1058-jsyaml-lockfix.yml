name: PR 1058 js-yaml Lock Fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  lockfix:
    if: github.event.pull_request.number == 1058
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: codex/automatic-revenue-compliance-gate-20260806

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Refresh js-yaml within existing semver ranges
        shell: bash
        run: |
          npm update js-yaml --package-lock-only --ignore-scripts
          npm ls js-yaml --omit=dev || true
          git diff -- package.json package-lock.json | tee jsyaml-lockfix.diff

      - name: Verify production audit
        shell: bash
        run: |
          npm audit --audit-level=high --omit=dev

      - name: Commit verified lockfile fix
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already fixed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(deps): update js-yaml to patched 4.3.1"
          git push origin HEAD:codex/automatic-revenue-compliance-gate-20260806
