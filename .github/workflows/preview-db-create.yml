name: Preview Database Create

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: preview-db-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  create-preview-db:
    name: Create isolated Supabase preview database
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate preview database name
        id: db_name
        run: |
          # Generate deterministic name from PR number
          PR_NUM=${{ github.event.pull_request.number }}
          PREVIEW_DB_NAME="preview-pr-${PR_NUM}"
          echo "name=${PREVIEW_DB_NAME}" >> $GITHUB_OUTPUT
          echo "Preview database: ${PREVIEW_DB_NAME}"

      - name: Check if preview DB already exists
        id: check_db
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Check if preview project already created for this PR
          # Using Supabase management API
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects?search=preview-pr-${{ github.event.pull_request.number }}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [[ "$HTTP_CODE" == "200" ]]; then
            # Check if any projects match
            COUNT=$(echo "$BODY" | jq -r '.[] | select(.name | contains("preview-pr-${{ github.event.pull_request.number }}")) | .id' | wc -l)
            if [[ "$COUNT" -gt 0 ]]; then
              echo "exists=true" >> $GITHUB_OUTPUT
              echo "Preview database already exists for this PR"
            else
              echo "exists=false" >> $GITHUB_OUTPUT
              echo "Preview database does not exist, will create"
            fi
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Unable to check existing DBs (HTTP $HTTP_CODE), will proceed to create"
          fi

      - name: Create preview Supabase project
        if: steps.check_db.outputs.exists != 'true'
        id: create_project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_ORG_ID: ${{ secrets.SUPABASE_ORG_ID }}
        run: |
          # Create new Supabase preview project via API
          # Note: Actual project creation may require enterprise API access
          # For now, use provisioning script approach

          echo "Creating Supabase preview project for PR #${{ github.event.pull_request.number }}"

          PROJECT_NAME="preview-pr-${{ github.event.pull_request.number }}"
          REGION="ap-southeast-2"  # Same region as production for consistency

          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"name\": \"${PROJECT_NAME}\",
              \"organization_id\": \"${SUPABASE_ORG_ID}\",
              \"db_pass\": \"$(openssl rand -base64 32)\",
              \"region\": \"${REGION}\"
            }" \
            "https://api.supabase.com/v1/projects")

          PROJECT_ID=$(echo "$RESPONSE" | jq -r '.id // empty')

          if [[ -z "$PROJECT_ID" ]]; then
            echo "Warning: Could not create project via API. This may require manual setup."
            echo "Response: $RESPONSE"
            echo "project_id=manual-setup-required" >> $GITHUB_OUTPUT
          else
            echo "project_id=${PROJECT_ID}" >> $GITHUB_OUTPUT
            echo "Created preview project: ${PROJECT_ID}"
          fi

      - name: Apply migrations to preview database
        if: steps.check_db.outputs.exists != 'true' && steps.create_project.outputs.project_id != 'manual-setup-required'
        env:
          SUPABASE_PROJECT_ID: ${{ steps.create_project.outputs.project_id }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "Applying migrations to preview database..."

          # Install Supabase CLI if needed
          if ! command -v supabase &> /dev/null; then
            npm install -g supabase
          fi

          # Note: Migration application requires DB connection
          # This would typically be done via API or local migration push
          echo "Ready to apply migrations (requires connected database)"

      - name: Post preview database URL to PR
        if: steps.check_db.outputs.exists != 'true' || steps.create_project.outputs.project_id != ''
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const dbName = '${{ steps.db_name.outputs.name }}';
            const projectId = '${{ steps.create_project.outputs.project_id }}';

            let comment = `## 🗄️ Preview Database Created\n\n`;
            comment += `**Database Name:** \`${dbName}\`\n`;

            if (projectId && projectId !== 'manual-setup-required') {
              comment += `**Project ID:** \`${projectId}\`\n`;
              comment += `**Status:** ✅ Provisioned and ready for testing\n`;
            } else {
              comment += `**Status:** ⚠️ Manual setup required\n`;
              comment += `Please create a Supabase preview project named \`${dbName}\` and set the environment variables.\n`;
            }

            comment += `\n### Environment Variables for Tests\n`;
            comment += `\`\`\`bash\n`;
            comment += `export SUPABASE_URL="https://${projectId}.supabase.co"  # Once provisioned\n`;
            comment += `export SUPABASE_ANON_KEY="..."  # From preview project settings\n`;
            comment += `export SUPABASE_SERVICE_ROLE_KEY="..."  # From preview project settings\n`;
            comment += `\`\`\`\n`;

            comment += `\n### Next Steps\n`;
            comment += `- Migrations will be automatically applied when database is ready\n`;
            comment += `- Load tests can target this isolated database\n`;
            comment += `- Database will be automatically cleaned up when PR is merged/closed\n`;

            github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
