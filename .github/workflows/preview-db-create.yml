name: Preview Database Create

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-db-config-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-preview-db:
    name: Validate isolated Supabase preview database configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PREVIEW_DB_URL: ${{ secrets.PREVIEW_DB_URL }}
      PREVIEW_DB_ANON_KEY: ${{ secrets.PREVIEW_DB_ANON_KEY }}
      PREVIEW_DB_SERVICE_ROLE_KEY: ${{ secrets.PREVIEW_DB_SERVICE_ROLE_KEY }}

    steps:
      - name: Detect preview database configuration
        id: config
        shell: bash
        run: |
          if [[ -z "$PREVIEW_DB_URL" || -z "$PREVIEW_DB_ANON_KEY" || -z "$PREVIEW_DB_SERVICE_ROLE_KEY" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "No complete isolated preview database configuration is present."
            echo "No Supabase project will be created automatically and no shared database will be used."
            exit 0
          fi

          [[ "$PREVIEW_DB_URL" =~ ^https://[a-z0-9-]+\.supabase\.co/?$ ]] || {
            echo "Configured PREVIEW_DB_URL is not a valid Supabase project URL."
            exit 1
          }

          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Verify configured preview database is reachable
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          STATUS=$(curl --silent --show-error --output /tmp/preview-db-health.json \
            --write-out "%{http_code}" --max-time 20 \
            -H "apikey: $PREVIEW_DB_ANON_KEY" \
            -H "Authorization: Bearer $PREVIEW_DB_ANON_KEY" \
            "${PREVIEW_DB_URL%/}/rest/v1/")
          test "$STATUS" = "200" || {
            echo "Configured preview database health check failed with HTTP $STATUS."
            exit 1
          }
          echo "Isolated preview database is configured and reachable."

      - name: Report preview database configuration
        uses: actions/github-script@v7
        env:
          CONFIGURED: ${{ steps.config.outputs.configured }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const configured = process.env.CONFIGURED === 'true';
            const body = configured
              ? '## Preview Database\n\nStatus: **READY**\n\nAn explicitly configured isolated Supabase preview database is reachable. No project was auto-created.'
              : '## Preview Database\n\nStatus: **SKIPPED — NOT CONFIGURED**\n\nNo isolated preview database secrets are configured. The workflow did not create a Supabase project and did not use development or production data.';

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
