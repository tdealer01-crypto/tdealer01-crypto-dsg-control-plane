name: Agent — Production Readiness Baseline

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  deployments: read

jobs:
  prod-readiness-agent:
    runs-on: ubuntu-latest
    name: Production Readiness Baseline
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js
        id: build
        continue-on-error: true
        run: npm run build

      - name: Type Check
        id: typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: Check Deployment Config
        id: config
        continue-on-error: true
        run: |
          test -f vercel.json && echo "VERCEL_JSON=present" >> "$GITHUB_OUTPUT" || echo "VERCEL_JSON=missing" >> "$GITHUB_OUTPUT"
          test -f .env.example && echo "ENV_DOCS=present" >> "$GITHUB_OUTPUT" || echo "ENV_DOCS=missing" >> "$GITHUB_OUTPUT"

      - name: Report Baseline Readiness
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const buildPassed = '${{ steps.build.outcome }}' === 'success';
            const typePassed = '${{ steps.typecheck.outcome }}' === 'success';
            const configPresent = '${{ steps.config.outputs.VERCEL_JSON }}' === 'present';

            let message = '## Production Readiness Baseline\n\n';
            message += `- Next.js build: ${buildPassed ? 'PASS' : 'FAIL'}\n`;
            message += `- TypeScript: ${typePassed ? 'PASS' : 'FAIL'}\n`;
            message += `- Deployment config: ${configPresent ? 'PRESENT' : 'MISSING'}\n\n`;

            if (buildPassed && typePassed && configPresent) {
              message += '**BASELINE CHECKS PASSED — NOT A PRODUCTION-READY CLAIM**\n\n';
              message += 'These checks do not prove security, correctness, benchmark capacity, DSG authorization, deployment success, observed postconditions, or replay evidence.\n';
              message += 'Use the `Verified Software E2E` workflow for the release evidence chain.\n';
            } else {
              message += '**BASELINE BLOCKED**\n\n';
              message += 'Fix the failed baseline checks before running the full verified release flow.\n';
            }

            if (context.payload.pull_request) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: message,
              });
            } else {
              core.summary.addRaw(message);
              await core.summary.write();
            }
