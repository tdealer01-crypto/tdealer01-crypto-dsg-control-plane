name: Repair Lockfile PR1185

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/repair-lockfile-pr1185.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-lockfile:
    name: Regenerate lockfile on Linux
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/azure-pr-validation-runner')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: feat/azure-pr-validation-runner
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Regenerate lockfile deterministically
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          mapfile -t changed < <(git diff --name-only)
          printf 'changed=%s\n' "${changed[*]:-}"
          if [ "${#changed[@]}" -eq 0 ]; then
            echo 'LOCKFILE_ALREADY_IN_SYNC=true' >> "$GITHUB_ENV"
            exit 0
          fi
          if [ "${#changed[@]}" -ne 1 ] || [ "${changed[0]}" != 'package-lock.json' ]; then
            echo '::error::LOCKFILE_REPAIR_SCOPE_VIOLATION' >&2
            git diff --name-status >&2
            exit 1
          fi
          if grep -q '"@vercel/analytics"' package-lock.json || grep -q '"@vercel/speed-insights"' package-lock.json; then
            echo '::error::REMOVED_VERCEL_ROOT_DEPENDENCY_STILL_PRESENT_IN_LOCKFILE' >&2
            exit 1
          fi
      - name: Commit generated lockfile only
        if: env.LOCKFILE_ALREADY_IN_SYNC != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = 'package-lock.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: sync package-lock after Vercel removal'
          git push origin HEAD:feat/azure-pr-validation-runner
