name: Vercel Deploy Cost Lock

# Cost lock enabled 2026-08-18.
# Automatic Vercel preview/production deploys are intentionally disabled.
# Restore the prior workflow from Git history only after the user approves Vercel spend again.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cost-lock:
    name: Vercel deployment disabled
    runs-on: ubuntu-latest
    steps:
      - name: Explain cost lock
        run: |
          echo "Vercel automatic deployment is disabled to prevent additional on-demand spend."
          echo "Repository source and deployment history are preserved."
