name: Build & Verify Render Deployment

# Vercel billing is blocked for this project: `vercel deploy` returns
# BUILD_FAILED / "Resource provisioning failed" in under 3 seconds with an empty
# build log, so the old per-PR Vercel preview job could never go green. It has
# been removed rather than left red.
#
# Render deploys `main` itself (see render.yaml: autoDeployTrigger: commit,
# branch: main), so CI must not trigger a deploy — that would double-deploy the
# same commit. CI's job here is to *verify* the deploy landed, which is also the
# deployed-commit evidence docs/RUNBOOK_DEPLOY.md requires before a GO.
#
# Pull requests get validate + build only. `npm run build` is the meaningful
# compile gate for App Router changes; no remote environment is spun up per PR,
# which also avoids per-preview hosting cost.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  validate:
    name: Validate & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Type check
        run: npm run typecheck
      - name: Run unit tests
        run: npm run test:unit
      - name: Lint
        run: npm run lint
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: next-build-${{ github.sha }}
          path: .next
          retention-days: 1

  verify-render:
    name: Verify Render Deployment
    runs-on: ubuntu-latest
    needs: build
    # Dispatch-only, deliberately. Production does not auto-deploy — render.yaml
    # sets `autoDeployTrigger: "off"` because
    # scripts/verify-agent-workspace-boundary.mjs requires production to stay
    # behind a gated manual promotion. Polling on push to `main` would therefore
    # wait 15 minutes for a deploy that never happens. Run this after a
    # promotion to confirm the deployed commit.
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 20
    steps:
      # Fails open while the Render service does not exist yet: reporting
      # "not configured" is honest, whereas failing would make every push red
      # for a reason nobody can fix from the repo. Once RENDER_SERVICE_URL is
      # set, the checks below are enforced.
      - name: Check Render service is configured
        id: config
        shell: bash
        env:
          RENDER_SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL }}
        run: |
          if [ -z "$RENDER_SERVICE_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Render deployment::SKIPPED — NOT CONFIGURED. Set the RENDER_SERVICE_URL secret to the service origin (https://<service>.onrender.com) to enable deployed-commit verification. See docs/RUNBOOK_RENDER_MIGRATION.md."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # Render auto-deploys this commit from its own GitHub integration, so poll
      # until the deployed commit matches rather than triggering a deploy.
      - name: Wait for the pushed commit to be live
        if: steps.config.outputs.configured == 'true'
        shell: bash
        env:
          RENDER_SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL }}
        run: |
          set -euo pipefail
          expected="${GITHUB_SHA}"
          deadline=$(( SECONDS + 900 ))
          attempt=0

          while [ "$SECONDS" -lt "$deadline" ]; do
            attempt=$(( attempt + 1 ))
            body=$(curl -fsS --max-time 20 "${RENDER_SERVICE_URL%/}/api/agent/status" || true)

            if [ -n "$body" ]; then
              platform=$(printf '%s' "$body" | jq -r '.platform // "unknown"')
              deployed=$(printf '%s' "$body" | jq -r '.commit // "unknown"')

              if [ "$deployed" = "$expected" ]; then
                echo "Deployed commit matches: $deployed (platform: $platform)"
                if [ "$platform" != "render" ]; then
                  echo "::warning title=Unexpected platform::/api/agent/status reports platform '$platform', expected 'render'. Host env vars may not be reaching the app."
                fi
                exit 0
              fi

              echo "attempt $attempt: deployed=$deployed expected=$expected platform=$platform"
            else
              echo "attempt $attempt: service not answering yet"
            fi

            sleep 20
          done

          echo "::error title=Render deployment not live::/api/agent/status never reported commit $expected within 15 minutes."
          exit 1

      - name: Smoke public health
        if: steps.config.outputs.configured == 'true'
        shell: bash
        env:
          RENDER_SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL }}
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 "${RENDER_SERVICE_URL%/}/api/health"

  notify-failure:
    name: Report Validation or Deployment Failure
    runs-on: ubuntu-latest
    needs: [validate, build, verify-render]
    if: always() && contains(needs.*.result, 'failure')
    steps:
      - name: Record failure
        run: |
          echo "Validation, build, or Render deployment verification failed."
          echo "Production promotion is not part of this workflow."
          exit 1
