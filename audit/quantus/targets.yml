  - id: poseidon
    repository: immunefi-team/audit-comp-quantus-qp-poseidon
    ref: audit-comp-ready
    sha: f885ad5dce133557cb3f7cce3f2ab29539008e7f
    in_scope_path: .
    notes:
      - Quantus Poseidon2 hash implementation is in scope.

  - id: chain
    repository: immunefi-team/audit-comp-quantus-chain
    ref: audit-comp-ready
    sha: 3b243b870a5442a6e5f443056f67bbba87d472f5
    in_scope_path: .
    notes:
      - Only Quantus-owned code and modifications are in scope.
      - Unmodified upstream Substrate and package dependencies are out of scope.
      - Malicious genesis and privileged actions within assigned privileges are out of scope.

guardrails:
  - Do not test against mainnet or a public testnet.
  - Do not perform denial-of-service against project assets.
  - Do not use project, DSG, Vercel, AWS, Supabase, or other deployment secrets.
  - Do not deploy or mutate Quantus infrastructure from this workflow.
  - Do not submit scanner-only output as a finding.
  - A candidate finding requires human scope review, demonstrated impact, and a runnable local PoC before submission.
