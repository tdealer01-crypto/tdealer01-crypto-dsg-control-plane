competition: "Immunefi Audit Comp | Quantus"
status: live
source_policy: frozen-competition-forks
execution_policy: local-only
secrets_policy: none
human_review_required: true

targets:
  - id: dilithium
    repository: immunefi-team/audit-comp-quantus-qp-rusty-crystals
    ref: audit-comp-ready
    sha: 94dfe6e671b29689c66148991630406e983e2457
    in_scope_path: dilithium
    cargo_package: qp-rusty-crystals-dilithium
    notes:
      - ML-DSA/Dilithium implementation is in scope.
      - threshold module is explicitly out of scope.

  - id: hdwallet
    repository: immunefi-team/audit-comp-quantus-qp-rusty-crystals
    ref: audit-comp-ready
    sha: 94dfe6e671b29689c66148991630406e983e2457
    in_scope_path: hdwallet
    cargo_package: qp-rusty-crystals-hdwallet
    notes:
      - HD-wallet module is in scope.
      - threshold module is explicitly out of scope.

  - id: zk-circuits
    repository: immunefi-team/audit-comp-quantus-qp-zk-circuits
    ref: audit-comp-ready
    sha: 2a6914ed0184fbc0aaf621801ac8b8b7e3b01f6e
    in_scope_path: .
    notes:
      - Quantus ZK-circuit code/modifications are in scope.
      - voting module is explicitly out of scope.
