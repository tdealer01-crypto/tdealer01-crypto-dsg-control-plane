<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- DSG Control Plane Logo -->
  <defs>
    <linearGradient id="gradDSG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E90FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1873CC;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#gradDSG)" opacity="0.1" />

  <!-- Gate shape (square with check) -->
  <rect x="25" y="25" width="50" height="50" rx="5" fill="none" stroke="#1E90FF" stroke-width="2" />

  <!-- Check mark inside -->
  <polyline points="35,50 45,60 65,40" fill="none" stroke="#1E90FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Accent dots representing evidence -->
  <circle cx="70" cy="30" r="2" fill="#1E90FF" />
  <circle cx="75" cy="50" r="2" fill="#1E90FF" />
  <circle cx="70" cy="70" r="2" fill="#1E90FF" />
</svg>
